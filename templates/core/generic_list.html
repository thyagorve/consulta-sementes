{% extends 'base.html' %}{% block heading %}{{ title }}{% endblock %}{% block content %}<div class="toolbar"><form><input name="q" value="{{ request.GET.q }}" placeholder="Buscar..."><button class="btn">Buscar</button></form><a class="btn primary" href="{% url create_url %}">+ Novo</a></div><section class="panel"><div class="table-wrap"><table><tr><th>Nome</th><th>Contato</th><th>Ações</th></tr>{% for x in items %}<tr><td>{{ x.name }}</td><td>{{ x.phone }}<br><small>{{ x.email }}</small></td><td><div class="row-actions"><a class="link" href="{% url detail_url x.pk %}">Editar</a>{% if delete_url %}<a class="link danger-text" href="{% url delete_url x.pk %}">Excluir</a>{% endif %}</div></td></tr>{% empty %}<tr><td colspan="3">Nenhum registro.</td></tr>{% endfor %}</table></div></section>{% endblock %}
