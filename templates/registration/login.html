{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <meta name="application-name" content="ImobCRM">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ImobCRM">
  <link rel="manifest" href="{% static 'pwa/manifest.webmanifest' %}?v=2">
  <link rel="icon" href="{% static 'pwa/favicon.ico' %}?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'pwa/apple-touch-icon.png' %}?v=2">
  <script>(()=>{const ua=navigator.userAgent||'';const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const standalone=window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true;if(ios)document.documentElement.classList.add('pwa-ios');if(standalone)document.documentElement.classList.add('pwa-standalone')})();</script>
  <title>Entrar | ImobCRM</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=7.0">
  <link rel="stylesheet" href="{% static 'css/v7_5.css' %}?v=7.5">
  <link rel="stylesheet" href="{% static 'css/v7_6.css' %}?v=7.6">
  <link rel="stylesheet" href="{% static 'css/v7_7_pwa.css' %}?v=7.7">
  <link rel="stylesheet" href="{% static 'css/v7_14_ios_pwa.css' %}?v=7.14">
</head>
<body class="login-page theme-darkglass">
  <div class="login-card">
    <div class="login-logo brand-icon app-brand-icon"><img src="{% static 'pwa/icon-192.png' %}" alt="ImobCRM"></div>
    <h1>ImobCRM</h1>
    <p>Gestão imobiliária e rede de corretores.</p>
    {% if request.GET.csrf == 'expired' %}<div class="alert warning login-session-alert">Sua sessão de segurança foi renovada. Digite seus dados novamente para entrar.</div>{% endif %}
    <form method="post" autocomplete="on">{% csrf_token %}{{ form.as_p }}<button class="btn primary full">Entrar</button></form>
    <div class="login-footer"><span class="muted">Ainda não tem acesso?</span><a class="btn full" href="{% url 'signup' %}">Criar conta de corretor</a></div>
  </div>
<script>
(()=>{const k='imobcrm.theme',m=localStorage.getItem(k)||'dark',d=m!=='light';document.body.classList.toggle('theme-darkglass',d);document.body.classList.toggle('theme-lightglass',!d)})();
// Safari/Chrome mobile e PWAs podem restaurar um formulário antigo do bfcache.
// O token CSRF muda ao entrar/sair; recarregar garante um token novo.
addEventListener('pageshow',event=>{
  const nav=performance.getEntriesByType?.('navigation')?.[0];
  if(event.persisted || nav?.type==='back_forward'){ location.reload(); }
});
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js',{scope:'/'}).catch(()=>{}));}</script>
</body></html>
