<!-- Modal Saldo -->
<div id="saldoModal" class="modal" style="display: none;">
    <div class="modal-overlay" onclick="closeModal('saldoModal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-wallet"></i> Alterar Saldo</h2>
            <span class="close-modal" onclick="closeModal('saldoModal')">&times;</span>
        </div>
        <div class="modal-body">
            <p class="cliente-info">Cliente: <strong id="clienteNomeSaldo"></strong></p>
            <form id="saldoForm" method="post" action="{% url 'alterar_saldo' %}">
                {% csrf_token %}
                <input type="hidden" name="cliente_id" id="clienteId" required>

                <div class="form-group">
                    <label for="valor">Valor (R$):</label>
                    <div class="input-with-icon">
                        <i class="fas fa-dollar-sign"></i>
                        <input type="number" name="valor" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Operação:</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="tipo" value="adicionar" checked>
                            <span class="radio-checkmark"></span>
                            <i class="fas fa-plus-circle"></i>
                            Adicionar Saldo
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="tipo" value="debitar">
                            <span class="radio-checkmark"></span>
                            <i class="fas fa-minus-circle"></i>
                            Debitar Saldo
                        </label>
                    </div>
                </div>

                <!-- Info de como o saldo afeta o total -->
                <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.82rem; color: #0369a1;">
                    <i class="fas fa-info-circle"></i>
                    <strong>Saldo positivo</strong> desconta do valor da parcela.
                    <strong>Saldo negativo</strong> soma ao valor da parcela.
                </div>

                <div class="form-group">
                    <label for="observacao">Observação (opcional):</label>
                    <textarea name="observacao" id="observacao" rows="2" placeholder="Motivo da alteração..."></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('saldoModal')">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="submit" form="saldoForm" class="btn btn-primary">
                <i class="fas fa-check"></i> Confirmar Alteração
            </button>
        </div>
    </div>
</div>
