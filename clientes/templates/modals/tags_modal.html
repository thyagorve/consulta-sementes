<!-- Modal de Tags - isolado do Bootstrap e dos modais legados -->
<div id="tagsModal" class="tls-tags-modal" style="display:none;" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="tagsModalTitle">
    <button type="button" class="tls-tags-backdrop" aria-label="Fechar" onclick="closeModal('tagsModal')"></button>

    <section class="tls-tags-dialog" role="document">
        <header class="tls-tags-header">
            <div class="tls-tags-title-wrap">
                <span class="tls-tags-title-icon"><i class="fas fa-tags"></i></span>
                <div>
                    <h2 id="tagsModalTitle">Gerenciar Tags</h2>
                    <p>Organize as tags deste cliente.</p>
                </div>
            </div>
            <button type="button" class="tls-tags-close" onclick="closeModal('tagsModal')" aria-label="Fechar">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <div class="tls-tags-body">
            <div id="clienteInfoTagsModal" class="tls-tags-client" style="display:none;">
                <i class="fas fa-user"></i>
                <span>Editando tags de: <strong id="nomeClienteTagsModal"></strong></span>
            </div>

            <div class="tls-tags-group">
                <label for="buscaTagInput"><i class="fas fa-search"></i> Filtrar tags</label>
                <div class="tls-tags-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscaTagInput" placeholder="Digite para filtrar tags..." autocomplete="off">
                </div>
            </div>

            <div class="tls-tags-group">
                <div class="tls-tags-label-row">
                    <label><i class="fas fa-list"></i> Tags disponíveis</label>
                    <span id="tagsCountBadge" class="tls-tags-count">0</span>
                </div>
                <div id="listaTagsContainer" class="tls-tags-listbox">
                    <div id="tagsLoading" class="tls-tags-empty">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Carregando tags...</span>
                    </div>
                    <div id="tagsLista"></div>
                    <div id="tagsVazia" class="tls-tags-empty" style="display:none;">
                        <i class="fas fa-tags"></i>
                        <span>Nenhuma tag cadastrada</span>
                        <small>Crie uma nova tag abaixo.</small>
                    </div>
                </div>
            </div>

            <div class="tls-tags-divider"><span>ou</span></div>

            <div class="tls-tags-group">
                <label for="novaTagNomeModal"><i class="fas fa-plus-circle"></i> Criar nova tag</label>
                <div class="tls-tags-create-row">
                    <input type="text" id="novaTagNomeModal" placeholder="Nome da tag" autocomplete="off">
                    <label class="tls-tags-color" title="Escolher cor">
                        <input type="color" id="novaTagCorModal" value="#667eea" aria-label="Cor da tag">
                    </label>
                    <button type="button" id="btnCriarTagModal" class="tls-tags-btn tls-tags-btn-primary">
                        <i class="fas fa-plus"></i><span>Criar</span>
                    </button>
                </div>
                <small class="tls-tags-help">A nova tag já ficará selecionada para este cliente.</small>
            </div>
        </div>

        <footer class="tls-tags-footer">
            <span id="tagsSelecionadasCount" class="tls-tags-selected">
                <i class="fas fa-check-circle"></i>
                <span id="countNum">0</span> tag(s) selecionada(s)
            </span>
            <div class="tls-tags-actions">
                <button type="button" class="tls-tags-btn tls-tags-btn-secondary" onclick="closeModal('tagsModal')">
                    Cancelar
                </button>
                <button type="button" id="btnSalvarTagsModalFinal" class="tls-tags-btn tls-tags-btn-primary">
                    <i class="fas fa-save"></i><span>Salvar</span>
                </button>
            </div>
        </footer>
    </section>
</div>

<style>
/* Isolado de .modal/.modal-content para não colidir com Bootstrap ou CSS legado. */

}

    min-height:36px;padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:8px !important;font-size:.76rem;font-weight:750;cursor:pointer;box-shadow:none !important;
}

<script>
// Limpeza de módulos antigos
delete window.abrirModalTags;
delete window.salvarTags;
delete window.criarNovaTag;
delete window.TagsModulo;
delete window.__TAGS_MODULE_LOADED__;
delete window._tagsModuleLoaded;
delete window.__tagsToggle;
delete window._tagToggle;


// ============================================
// MÓDULO DE TAGS - VERSÃO PREMIUM
// ============================================
(function() {
    'use strict';
    
    
    const MODAL_ID = 'tagsModal';
    const modalEl = document.getElementById(MODAL_ID);
    
    if (!modalEl) {
        return;
    }
    
    let clienteIdAtual = null;
    let todasTags = [];
    let tagsSelecionadas = [];
    
    function getCsrfToken() {
        const name = 'csrftoken';
        let value = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(function(cookie) {
                cookie = cookie.trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    value = decodeURIComponent(cookie.substring(name.length + 1));
                }
            });
        }
        return value;
    }
    
    // RENDERIZAR LISTA DE TAGS
    function renderizarLista(filtro) {
        const $container = document.getElementById('tagsLista');
        const $loading = document.getElementById('tagsLoading');
        const $vazia = document.getElementById('tagsVazia');
        const $badge = document.getElementById('tagsCountBadge');
        
        if (!$container) return;
        
        $loading.style.display = 'none';
        
        let tagsParaMostrar = todasTags;
        
        if (filtro && filtro.trim()) {
            const termo = filtro.trim().toLowerCase();
            tagsParaMostrar = todasTags.filter(function(t) {
                return t.nome.toLowerCase().indexOf(termo) !== -1;
            });
        }
        
        // Atualiza badge
        if ($badge) $badge.textContent = tagsSelecionadas.length;
        
        if (tagsParaMostrar.length === 0) {
            $container.style.display = 'none';
            $vazia.style.display = 'block';
            if (filtro && filtro.trim()) {
                $vazia.innerHTML = '<i class="fas fa-search" style="font-size: 2rem; opacity: 0.3;"></i><br><span>Nenhuma tag para "<b>' + filtro + '</b>"</span>';
            }
            return;
        }
        
        $vazia.style.display = 'none';
        $container.style.display = 'block';
        
        $container.innerHTML = tagsParaMostrar.map(function(tag) {
            const selecionada = tagsSelecionadas.indexOf(parseInt(tag.id)) !== -1;
            const cor = tag.cor || '#6c757d';
            
            return (
                '<div class="tag-item' + (selecionada ? ' selecionada' : '') + '" ' +
                'data-tag-id="' + tag.id + '" ' +
                'onclick="window._tagToggle(' + tag.id + ')">' +
                    '<div class="tag-checkbox"></div>' +
                    '<div class="tag-cor" style="background:' + cor + ';"></div>' +
                    '<span class="tag-nome">' + tag.nome + '</span>' +
                    (selecionada ? '<span class="tag-badge-selecionada">✓</span>' : '') +
                '</div>'
            );
        }).join('');
        
        // Atualiza contador
        atualizarContador();
    }
    
    // ATUALIZAR CONTADOR
    function atualizarContador() {
        const countEl = document.getElementById('countNum');
        if (countEl) countEl.textContent = tagsSelecionadas.length;
    }
    
    // TOGGLE TAG
    window._tagToggle = function(tagId) {
        tagId = parseInt(tagId);
        const index = tagsSelecionadas.indexOf(tagId);
        
        if (index > -1) {
            tagsSelecionadas.splice(index, 1);
        } else {
            tagsSelecionadas.push(tagId);
        }
        
        renderizarLista(document.getElementById('buscaTagInput').value);
    };
    
    // CARREGAR TODAS AS TAGS
    function carregarTodasTags() {
        const $loading = document.getElementById('tagsLoading');
        const $container = document.getElementById('tagsLista');
        const $vazia = document.getElementById('tagsVazia');
        
        $loading.style.display = 'block';
        $container.style.display = 'none';
        $vazia.style.display = 'none';
        
        fetch('/api/buscar-tags/?q=')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.results && Array.isArray(data.results)) {
                    todasTags = data.results.map(function(tag) {
                        return {
                            id: parseInt(tag.id),
                            nome: tag.text || tag.nome || 'Sem nome',
                            cor: tag.cor || '#6c757d'
                        };
                    });
                    carregarTagsDoCliente();
                } else {
                    $loading.style.display = 'none';
                    $vazia.style.display = 'block';
                }
            })
            .catch(function() {
                $loading.style.display = 'none';
                $vazia.style.display = 'block';
                $vazia.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i><br><span>Erro de conexão</span>';
            });
    }
    
    // CARREGAR TAGS DO CLIENTE
    function carregarTagsDoCliente() {
        if (!clienteIdAtual) {
            renderizarLista();
            return;
        }
        
        fetch('/cliente/' + clienteIdAtual + '/tags/')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.status === 'success' && data.tag_ids) {
                    tagsSelecionadas = data.tag_ids.map(function(id) { return parseInt(id); });
                } else {
                    tagsSelecionadas = [];
                }
                renderizarLista(document.getElementById('buscaTagInput').value);
            })
            .catch(function() {
                tagsSelecionadas = [];
                renderizarLista();
            });
    }
    
    // CRIAR TAG
    function criarTag() {
        const nomeInput = document.getElementById('novaTagNomeModal');
        const corInput = document.getElementById('novaTagCorModal');
        const nome = nomeInput ? nomeInput.value.trim() : '';
        const cor = corInput ? corInput.value : '#64748b';
        
        if (!nome) {
            window.AppUI.alert('⚠️ Digite um nome para a tag');
            if (nomeInput) nomeInput.focus();
            return;
        }
        
        const btn = document.getElementById('btnCriarTagModal');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando...';
        
        fetch('/api/criar-tag/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
            body: JSON.stringify({ nome: nome, cor: cor })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'success') {
                todasTags.push({
                    id: parseInt(data.tag.id),
                    nome: data.tag.nome,
                    cor: data.tag.cor
                });
                tagsSelecionadas.push(parseInt(data.tag.id));
                if (nomeInput) nomeInput.value = '';
                renderizarLista(document.getElementById('buscaTagInput').value);
            } else {
                window.AppUI.alert('❌ ' + (data.message || 'Erro'));
            }
        })
        .catch(function() { window.AppUI.alert('❌ Erro de rede'); })
        .finally(function() { btn.disabled = false; btn.innerHTML = originalHtml; });
    }
    
    // SALVAR TAGS
    function salvarTags() {
        if (!clienteIdAtual) {
            window.AppUI.alert('❌ Cliente não identificado');
            return;
        }
        
        const btn = document.getElementById('btnSalvarTagsModalFinal');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
        
        fetch('/cliente/' + clienteIdAtual + '/adicionar-tags/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
            body: JSON.stringify({ tag_ids: tagsSelecionadas })
        })
        .then(function(r) { return r.json(); })
        .then(async function(data) {
            if (data.status === 'success') {
                await window.AppUI.alert('✅ Tags salvas com sucesso!', {title:'Tags'});
                closeModal(MODAL_ID);
                location.reload();
            } else {
                window.AppUI.alert('❌ ' + (data.message || 'Erro'));
            }
        })
        .catch(function() { window.AppUI.alert('❌ Erro de rede'); })
        .finally(function() { btn.disabled = false; btn.innerHTML = originalHtml; });
    }
    
    // ABRIR MODAL
    window.abrirModalTags = function(clienteId) {
        if (!clienteId) return;
        
        clienteIdAtual = clienteId;
        todasTags = [];
        tagsSelecionadas = [];
        
        document.getElementById('clienteInfoTagsModal').style.display = 'block';
        document.getElementById('nomeClienteTagsModal').textContent = 'Cliente #' + clienteId;
        document.getElementById('novaTagNomeModal').value = '';
        document.getElementById('novaTagCorModal').value = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#64748b';
        document.getElementById('buscaTagInput').value = '';
        document.getElementById('countNum').textContent = '0';
        document.getElementById('tagsLoading').style.display = 'block';
        document.getElementById('tagsLista').style.display = 'none';
        document.getElementById('tagsVazia').style.display = 'none';
        
        openModal(MODAL_ID);
        
        setTimeout(function() { carregarTodasTags(); }, 200);
    };
    
    // EVENT LISTENERS
    modalEl.addEventListener('click', function(e) {
        if (e.target.dataset.action === 'fechar-modal') {
            closeModal(MODAL_ID);
        }
    });
    
    document.getElementById('btnCriarTagModal').addEventListener('click', function(e) {
        e.preventDefault();
        criarTag();
    });
    
    document.getElementById('btnSalvarTagsModalFinal').addEventListener('click', function(e) {
        e.preventDefault();
        salvarTags();
    });
    
    document.getElementById('buscaTagInput').addEventListener('input', function() {
        renderizarLista(this.value);
    });
    
    document.getElementById('novaTagNomeModal').addEventListener('keypress', function(e) {
        if (e.which === 13) {
            e.preventDefault();
            criarTag();
        }
    });
    
    
})();
</script>
