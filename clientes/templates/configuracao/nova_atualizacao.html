{% extends 'base.html' %}
{% block title %}Nova Atualização{% endblock %}
{% block content %}
<div class="container">
    <h2>Adicionar Nova Atualização</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar Atualização</button>
        <a href="{% url 'atualizacoes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
