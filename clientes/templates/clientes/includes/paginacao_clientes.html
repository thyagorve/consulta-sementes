<div class="table-info">
    <span>{{ mostrando }}</span>
</div>

{% if clientes.paginator.num_pages > 1 %}
<div class="pagination-controls">
    <div class="pagination-links">
        {% if clientes.has_previous %}
            <a href="#" class="pagination-btn page-link-ajax" data-page="1" title="Primeira página">
                <i class="fas fa-angle-double-left"></i>
            </a>
            <a href="#" class="pagination-btn page-link-ajax" data-page="{{ clientes.previous_page_number }}" title="Página anterior">
                <i class="fas fa-angle-left"></i>
            </a>
        {% else %}
            <span class="pagination-btn disabled"><i class="fas fa-angle-double-left"></i></span>
            <span class="pagination-btn disabled"><i class="fas fa-angle-left"></i></span>
        {% endif %}
        
        <span class="pagination-btn active">{{ clientes.number }}</span>
        
        {% if clientes.has_next %}
            <a href="#" class="pagination-btn page-link-ajax" data-page="{{ clientes.next_page_number }}" title="Próxima página">
                <i class="fas fa-angle-right"></i>
            </a>
            <a href="#" class="pagination-btn page-link-ajax" data-page="{{ clientes.paginator.num_pages }}" title="Última página">
                <i class="fas fa-angle-double-right"></i>
            </a>
        {% else %}
            <span class="pagination-btn disabled"><i class="fas fa-angle-right"></i></span>
            <span class="pagination-btn disabled"><i class="fas fa-angle-double-right"></i></span>
        {% endif %}
    </div>
    <span style="font-size:0.8rem;color:var(--text-light);">Página {{ clientes.number }} de {{ clientes.paginator.num_pages }}</span>
</div>
{% endif %}
