{% extends 'base.html' %}
{% block title %}Excluir Cliente{% endblock %}
{% block content %}
<div style="max-width:620px;margin:2rem auto;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-hard);overflow:hidden;">
        <div style="padding:1.35rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.8rem;">
            <div style="width:42px;height:42px;border-radius:12px;background:rgba(239,68,68,.10);color:var(--danger);display:flex;align-items:center;justify-content:center;"><i class="fas fa-user-times"></i></div>
            <div><h2 style="margin:0;color:var(--text);font-size:1.15rem;">Excluir cliente</h2><p style="margin:.18rem 0 0;color:var(--text-light);font-size:.86rem;">Confirme antes de remover este cadastro.</p></div>
        </div>
        <div style="padding:1.5rem;">
            <div style="padding:1rem;border-radius:12px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);color:var(--text);">
                Tem certeza que deseja excluir <strong>{{ cliente.nome }}</strong>?
            </div>
            <form method="post" style="display:flex;justify-content:flex-end;gap:.65rem;margin-top:1.35rem;" data-appui-confirm="Excluir este cliente?" data-appui-danger="1">
                {% csrf_token %}
                <a href="javascript:history.back()" class="btn" style="border:1px solid var(--border);background:var(--bg-card);color:var(--text);padding:.6rem .9rem;border-radius:10px;text-decoration:none;">Cancelar</a>
                <button type="submit" class="btn" style="border:1px solid var(--danger);background:var(--danger);color:white;padding:.6rem .9rem;border-radius:10px;"><i class="fas fa-trash-alt"></i> Excluir</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
