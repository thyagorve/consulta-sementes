<!-- MODAL DE RENOVAÇÃO -->
<!-- ============================================================ -->
<div id="modalRenovar" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closeModalRenovar()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-redo"></i> Renovar Cliente</h2>
            <span class="close-modal" onclick="closeModalRenovar()">&times;</span>
        </div>
        <div class="modal-body">
            <p class="cliente-info">Cliente: <strong id="clienteNomeRenovar"></strong></p>
            <form id="formRenovar" onsubmit="return false;">
                <input type="hidden" id="renovarClienteId">
                <div class="form-group">
                    <label for="dataVencimento">Nova Data de Vencimento:</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="dataVencimento" name="data_vencimento">
                    </div>
                    <small class="form-help">Se não preencher, será adicionado 30 dias automaticamente</small>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModalRenovar()"><i class="fas fa-times"></i> Cancelar</button>
            <button type="button" class="btn btn-primary" id="btnConfirmarRenovacao" data-url="">
                <i class="fas fa-check"></i> Confirmar Renovação
            </button>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL DE COMPARTILHAMENTO (MANTIDO COMO FALLBACK) -->
<!-- ============================================================ -->
<div id="modalCompartilhamento" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="document.getElementById('modalCompartilhamento').style.display='none';document.body.style.overflow='';"></div>
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
            <h3><i class="fas fa-users"></i> Compartilhamento de Custo</h3>
            <span class="close-modal" onclick="document.getElementById('modalCompartilhamento').style.display='none';document.body.style.overflow='';">&times;</span>
        </div>
        <div class="modal-body">
            <div id="compartilhamento-body" style="margin-bottom:1.5rem;"><p>Carregando informações...</p></div>
            <div style="display:flex; gap:10px; margin-top:1.5rem;">
                <button onclick="decidirPagamento('outro')" class="btn btn-secondary" style="flex:1;"><i class="fas fa-user-check"></i> Outro já pagou</button>
                <button onclick="decidirPagamento('este')" class="btn btn-primary" style="flex:1; background:linear-gradient(135deg,#667eea,#764ba2);"><i class="fas fa-check-circle"></i> Este cliente paga</button>
            </div>
            <button onclick="document.getElementById('modalCompartilhamento').style.display='none';document.body.style.overflow='';" class="btn btn-link" style="width:100%; margin-top:12px; color:var(--text-light);"><i class="fas fa-times"></i> Cancelar</button>
        </div>
    </div>
</div>
