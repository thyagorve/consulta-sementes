{% extends 'sapp/base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --kanban-bg: #f1f5f9;
        --verde: #2f8f4e;
        --verde-escuro: #1e5f34;
    }


    .kanban-scrollbar-top::-webkit-scrollbar {
        height: 14px;
    }

    .kanban-scrollbar-top::-webkit-scrollbar-thumb {
    background: linear-gradient(
        90deg,
        #2f8f4e,
        #4eaa68
    );

    border: 2px solid #d8e4db;
        border-radius: 999px;
    }
    /* ===== BARRA DE ROLAGEM SUPERIOR ===== */
    .kanban-scrollbar-top {
        
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        height: 8px;
        background: #d4e0d7;
        border-radius: 6px;
        margin-bottom: 10px;
        visibility: hidden;
        transition: visibility 0.2s;
    }
    .kanban-scrollbar-top.visible {
        visibility: visible;
    }
    .kanban-scrollbar-content {
        height: 1px;
    }

    /* ===== KANBAN WRAPPER ===== */
    .kanban-wrapper {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 4px 2px 20px 16px;
        min-height: calc(100vh - 250px);
        align-items: flex-start;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        scroll-padding-left: 16px;
    }

    .kanban-column {
        min-width: 322px;
        max-width: 350px;
        flex: 0 0 auto;
        background: var(--kanban-bg);
        border: 1px solid #dbe6de;
        border-radius: 19px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 200px);
        scroll-snap-align: start;
        margin: 0;
        background: rgba(247,250,248,.96);
        box-shadow: 0 10px 30px rgba(27,52,34,.08);
        overflow: hidden;
    }

    .kanban-column-header {
        min-height: 53px;
        padding: 12px 15px;
        border-radius: 16px 16px 0 0;
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        box-shadow: inset 0 -1px rgba(255,255,255,.24);
    }

    .kanban-column-body {
        padding: 11px;
        overflow-y: auto;
        flex: 1;
    }

    .kanban-card {
        background: white;
        border: 1px solid #e1e9e3;
        border-left-width: 5px;
        border-radius: 15px;
        padding: 13px;
        margin-bottom: 10px;
        box-shadow: 0 4px 14px rgba(20,50,29,.075);
        cursor: grab;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }
    .kanban-card:before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, rgba(47,143,78,.1), rgba(47,143,78,.6), rgba(47,143,78,.1));
    }
    .kanban-card:hover {
        box-shadow: 0 12px 27px rgba(20,50,29,.15);
        transform: translateY(-3px);
    }
    .kanban-card:active { cursor: grabbing; opacity: 0.8; }
    .kanban-card.dragging {
        opacity: 0.5;
        transform: rotate(2deg) scale(0.95);
    }
    .kanban-card.drag-over {
        border: 2px dashed var(--verde);
        background: #f0fdf4;
    }

    .kanban-card.prioridade-URGENTE { border-left-color: #dc3545; }
    .kanban-card.prioridade-ALTA { border-left-color: #fd7e14; }
    .kanban-card.prioridade-MEDIA { border-left-color: #ffc107; }
    .kanban-card.prioridade-BAIXA { border-left-color: #6c757d; }

    .card-prioridade-badge {
        position: absolute;
        top: 9px; right: 9px;
        font-size: .52rem;
        padding: 3px 7px;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .card-status-badge {
        font-size: .56rem;
        padding: 4px 8px;
        border-radius: 8px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 4px;
    }

    .card-progress {
        height: 6px;
        background: #e9ecef;
        border-radius: 2px;
        margin: 8px 0;
        overflow: hidden;
    }
    .card-progress-bar {
        height: 100%;
        border-radius: 2px;
        transition: width 0.5s ease;
    }

    .card-actions {
        display: flex;
        gap: 4px;
        margin-top: 6px;
        flex-wrap: wrap;
        padding-top: 8px;
        border-top: 1px solid #edf1ee;
    }
    .card-actions .btn {
        font-size: 0.6rem;
        padding: 3px 8px;
        border-radius: 8px;
        min-width: 32px;
    }

    .coluna-drop-zone {
        min-height: 60px;
        border: 2px dashed transparent;
        border-radius: 8px;
        transition: all 0.3s;
    }
    .coluna-drop-zone.active {
        border-color: var(--verde);
        background: rgba(47, 143, 78, 0.05);
    }

    .empty-column {
        text-align: center;
        color: #94a3b8;
        padding: 20px 10px;
        font-size: 0.75rem;
    }

    /* ===== TOPO UNIFICADO ===== */
    body { background: #f5f8f6; }
    .kanban-page-shell {
        padding: 14px;
        min-height: calc(100vh - 70px);
        background:
            radial-gradient(circle at 8% 0%, rgba(47,143,78,.13), transparent 30%),
            linear-gradient(180deg,#f8fbf9,#eef4f0);
    }

    .kanban-premium-header {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 16px;
        align-items: center;
        padding: 18px 20px;
        margin-bottom: 14px;
        border-radius: 22px;
        color: #fff;
        background: linear-gradient(135deg,#153e26,#2f8f4e 68%,#55ad6e);
        box-shadow: 0 16px 38px rgba(26,91,50,.22);
        position: relative;
        overflow: visible;
    }
    .kanban-premium-header:after {
        content: "";
        position: absolute;
        width: 230px;
        height: 230px;
        right: -80px;
        top: -125px;
        border-radius: 50%;
        background: rgba(255,255,255,.09);
        pointer-events: none;
    }

    .kanban-premium-title h5 {
        font-size: 1.18rem;
        font-weight: 900;
        margin: 0;
    }
    .kanban-premium-title small {
        color: rgba(255,255,255,.78);
    }

    .kanban-search-box {
        position: relative;
        z-index: 5;
        min-width: 280px;
    }
    .kanban-search-box input {
        width: 100%;
        min-height: 46px;
        padding: 0 44px 0 43px;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 14px;
        background: rgba(255,255,255,.96);
        outline: none;
        box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }
    .kanban-search-box input:focus {
        box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 10px 25px rgba(0,0,0,.16);
    }
    .kanban-search-box .fa-search {
        position: absolute;
        left: 15px;
        top: 15px;
        color: #2f8f4e;
    }
    .kanban-search-results {
        position: absolute;
        top: 53px;
        left: 0;
        right: 0;
        z-index: 3000;
        display: none;
        max-height: 360px;
        overflow: auto;
        border-radius: 15px;
        padding: 7px;
        background: #fff;
        color: #17231b;
        box-shadow: 0 20px 55px rgba(0,0,0,.25);
        border: 1px solid #dce7df;
        max-width: 100%;
        box-sizing: border-box;
    }
    .kanban-result-item {
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .kanban-result-item:hover {
        background: #eff8f2;
        border-color: #cce3d3;
    }
    .kanban-result-item strong {
        display: block;
        font-size: .78rem;
    }
    .kanban-result-item small {
        color: #748078;
    }

    .kanban-header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .kanban-header-actions .btn {
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 10px;
        white-space: nowrap;
    }

    .card-details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin: 8px 0;
        font-size: .62rem;
        color: #66766c;
    }
    .card-details-grid > span {
        padding: 5px 6px;
        border-radius: 8px;
        background: #f6f9f7;
        border: 1px solid #ebf0ed;
    }
    .card-destination {
        margin-top: 7px;
        padding: 7px 8px;
        border-radius: 9px;
        color: #175a31;
        background: #ebf8ef;
        border: 1px solid #cfe8d7;
        font-size: .64rem;
        font-weight: 750;
    }
    .card-tags-premium {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
    }
    .card-tag-premium {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 7px;
        border-radius: 999px;
        font-size: .54rem;
        font-weight: 850;
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .kanban-card.search-highlight {
        animation: kbPulse 1.7s ease;
        box-shadow: 0 0 0 5px rgba(255,193,7,.28), 0 14px 28px rgba(0,0,0,.16);
    }
    @keyframes kbPulse {
        0%,100% { transform: scale(1); }
        45% { transform: scale(1.035); }
    }

    .btn-card-tag {
        color: #7c3aed;
        border-color: #c4b5fd;
        background: #faf8ff;
    }
    .btn-card-tag:hover {
        color: #fff;
        border-color: #7c3aed;
        background: #7c3aed;
    }
    .tag-selector-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
    }
    .tag-selector-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 11px;
        border-radius: 999px;
        border: 3px solid transparent;
        cursor: pointer;
        font-size: .7rem;
        font-weight: 800;
        opacity: .55;
        transition: .18s ease;
        user-select: none;
    }
    .tag-selector-item:hover {
        opacity: .85;
        transform: translateY(-1px);
    }
    .tag-selector-item.selected {
        opacity: 1;
        border-color: #17231b;
        box-shadow: 0 5px 13px rgba(0,0,0,.16);
        transform: translateY(-1px);
    }
    .tag-empty-state {
        width: 100%;
        padding: 18px;
        text-align: center;
        color: #76837b;
        border: 1px dashed #cedbd2;
        border-radius: 12px;
        background: #f8fbf9;
    }

    /* ===== MEDIA QUERIES ===== */
    @media (min-width: 1200px) {
        .kanban-wrapper {
            padding-left: 24px;
            padding-right: 24px;
            scroll-padding-left: 24px;
        }
        .kanban-column {
            min-width: 320px;
            max-width: 380px;
        }
    }

    @media (min-width: 769px) and (max-width: 1199px) {
        .kanban-wrapper {
            gap: 14px;
            padding-left: 14px;
            padding-right: 14px;
            scroll-padding-left: 14px;
        }
        .kanban-column {
            min-width: 280px;
            max-width: 320px;
        }
        .kanban-card { padding: 11px; }
        .card-actions .btn {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
    }

    @media (max-width: 768px) {
        .kanban-scrollbar-top { display: none; }
        .kanban-wrapper {
            gap: 12px;
            padding: 12px 6px 24px 12px;
            scroll-padding-left: 12px;
        }
        .kanban-column {
            min-width: 260px;
            max-width: 300px;
        }
        .kanban-card { padding: 10px; }
        .card-actions .btn {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
        .kanban-page-shell { padding: 7px 4px 18px; }
        .kanban-premium-header {
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .kanban-header-actions {
            justify-content: flex-start;
        }
        .card-details-grid { grid-template-columns: 1fr; }
    }

    table {
    width: 100%;
    border-collapse: collapse;
    /* remova table-layout: fixed; */
    font-size: 8px;
}

    /* ===== CORREÇÕES DE ESTABILIDADE E ACABAMENTO ===== */

    .kanban-card.search-highlight {

    }

    @keyframes kbSearchGlow {
        0%, 100% { transform: translateY(0) scale(1); }
        45% { transform: translateY(-2px) scale(1.018); }
    }

    .report-destino {
        border-left: 5px solid #2f8f4e !important;
        background: linear-gradient(135deg, #ecf8f0, #ffffff) !important;
    }

    .report-observacao {
        border-left: 5px solid #f59e0b !important;
        background: linear-gradient(135deg, #fff8e8, #ffffff) !important;

</style>

<script>
// ===== FUNÇÕES UTILITÁRIAS =====
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function mostrarToast(mensagem) {
    const container = document.getElementById('toastContainer') || (() => {
        const div = document.createElement('div');
        div.id = 'toastContainer';
        div.className = 'toast-container position-fixed bottom-0 end-0 p-3';
        document.body.appendChild(div);
        return div;
    })();
    const toastId = 'toast-' + Date.now();
    const html = `
        <div id="${toastId}" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">${mensagem}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
}

// ===== KANBAN PRINCIPAL =====
let kanbanData = null;
let cardArrastado = null;
let colunaOrigem = null;
let cardParaMover = null;

document.addEventListener('DOMContentLoaded', carregarKanban);

async function carregarKanban() {
    try {
        const resp = await fetch('/api/kanban/dados/');
        const data = await resp.json();
        if (data.success) {
            kanbanData = data;
            renderizarKanban(data.colunas);
        }
    } catch (e) {
        console.error('Erro ao carregar Kanban:', e);
        document.getElementById('kanbanBoard').innerHTML = `
            <div class="text-center py-5 w-100 text-danger">
                <i class="fas fa-exclamation-circle fa-3x mb-3"></i>
                <h5>Erro ao carregar Kanban</h5>
            </div>
        `;
    }
}

function renderizarKanban(colunas) {
    const board = document.getElementById('kanbanBoard');
    board.innerHTML = '';
    colunas.forEach(coluna => {
        const colEl = document.createElement('div');
        colEl.className = 'kanban-column';
        colEl.dataset.colunaId = coluna.id;
        colEl.dataset.colunaNome = coluna.nome;
        colEl.innerHTML = `
            <div class="kanban-column-header" style="background: ${coluna.cor};">
                <span><i class="fas fa-circle me-2" style="font-size: 0.5rem;"></i>${coluna.nome}</span>
                <span class="badge bg-light text-dark">${coluna.total}</span>
            </div>
            <div class="kanban-column-body coluna-drop-zone" 
                 data-coluna-id="${coluna.id}"
                 ondragover="handleDragOver(event)" 
                 ondragleave="handleDragLeave(event)" 
                 ondrop="handleDrop(event)">
                ${coluna.cards.length === 0 ? 
                    '<div class="empty-column"><i class="fas fa-inbox fa-2x d-block mb-2 opacity-50"></i>Vazio</div>' : 
                    coluna.cards.map(card => criarCardHTML(card)).join('')
                }
            </div>
        `;
        board.appendChild(colEl);
    });
    document.querySelectorAll('.kanban-card').forEach(card => {
        card.addEventListener('dragstart', handleDragStart);

}

        ...new Set(
            (card.embalagens || [])
                .map(v =>
                    String(v || '')
                        .trim()
                        .toUpperCase()
                )
                .filter(Boolean)
        )
    ];

    embalagens.sort((a, b) => {
        const ordem = {
            BAG: 1,
            SC: 2
        };

        return (
            (ordem[a] ?? 99)
            - (ordem[b] ?? 99)
        );
    });

    const unidade = (
        card.unidade_controle === 'QUILOGRAMA'
            ? 'KG'
            : (
                embalagens.length
                    ? embalagens.join('/')
                    : 'BAGS/SC'
            )
    );

    const qtdFormatada = (
        card.unidade_controle === 'QUILOGRAMA'
            ? Number(qtdEmp).toFixed(2)
            : Math.round(qtdEmp)
    );

    const percentual =
        card.percentual_empenhado ??
        (
            card.quantidade_solicitada > 0
                ? (
                    card.quantidade_empenhada

        'CONCLUIDO': '#d4edda',
        'CANCELADO': '#f8d7da',

        'URGENTE': 'danger',

        'MEDIA': 'secondary',
        'BAIXA': 'secondary'

            <span class="card-prioridade-badge bg-${prioridadeBadgeColor[card.prioridade] || 'secondary'} text-${card.prioridade === 'ALTA' ? 'dark' : 'white'}">
                ${card.prioridade}
            </span>
            <h6 class="mb-1 pe-4" style="font-size:0.8rem;">${card.titulo}</h6>
            <span class="card-status-badge" style="background: ${statusColors[card.status] || '#f8f9fa'};">
                ${card.status_display || card.status}
            </span>
            <div class="card-progress">
                <div class="card-progress-bar ${percentual >= 100 ? 'bg-success' : percentual >= 50 ? 'bg-warning' : 'bg-danger'}" 
                     style="width: ${percentual}%"></div>
            </div>
            <div class="card-details-grid">
                <span><i class="fas fa-box me-1"></i>${qtdFormatada}/${card.quantidade_solicitada} ${unidade}</span>
                <span><i class="fas fa-user me-1"></i>${card.criador_nome || '-'}</span>

            <div class="card-tags-premium">
                ${(card.tags || []).map(tag => `<span class="card-tag-premium" style="background:${tag.cor || '#2f8f4e'};color:${tag.cor_texto || '#fff'}">${tag.icone ? `<i class="${tag.icone}"></i>` : ''}${tag.nome}</span>`).join('')}

// ===== DRAG & DROP =====
function handleDragStart(e) {
    cardArrastado = this;
    colunaOrigem = this.closest('.kanban-column').dataset.colunaId;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.cardId);
}
function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.coluna-drop-zone.active').forEach(zone => zone.classList.remove('active'));
    cardArrastado = null;
    colunaOrigem = null;
}
function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('active');
}
function handleDragLeave(e) {
    this.classList.remove('active');
}
async function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('active');
    const cardId = e.dataTransfer.getData('text/plain');
    const colunaDestinoId = this.dataset.colunaId;
    if (colunaDestinoId === colunaOrigem) return;
    if (cardArrastado) this.appendChild(cardArrastado);
    await moverCardAPI(cardId, colunaDestinoId);
    setTimeout(recarregarKanban, 500);
}

function abrirModalMover(cardId, cardTitulo) {
    cardParaMover = cardId;

async function moverCardAPI(cardId, colunaDestinoId, observacao = '') {
    try {
        const resp = await fetch(`/api/solicitacoes/${cardId}/mover-kanban/`, {
            method: 'POST',

                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')

// ===== BARRA DE ROLAGEM SUPERIOR - ESTÁVEL =====
let scrollbarKanbanConfigurada = false;
let resizeObserverKanban = null;
let sincronizandoScrollKanban = false;
let rafScrollKanban = null;

function configurarScrollbarSuperior() {
    const wrapper = document.getElementById('kanbanBoard');
    const scrollTop = document.getElementById('kanbanScrollbarTop');
    const scrollContent = document.getElementById('kanbanScrollbarContent');

    if (!wrapper || !scrollTop || !scrollContent) return;

    function atualizarLarguraScrollbar() {
        const largura = Math.max(
            wrapper.scrollWidth,
            wrapper.clientWidth
        );

        scrollContent.style.width = `${largura}px`;

        scrollTop.classList.toggle(
            'visible',
            wrapper.scrollWidth > wrapper.clientWidth + 2
        );

        if (!sincronizandoScrollKanban) {
            scrollTop.scrollLeft = wrapper.scrollLeft;
        }
    }

    if (!scrollbarKanbanConfigurada) {
        scrollbarKanbanConfigurada = true;

        scrollTop.addEventListener(
            'scroll',
            () => {
                if (sincronizandoScrollKanban) return;

                sincronizandoScrollKanban = true;

                cancelAnimationFrame(rafScrollKanban);
                rafScrollKanban = requestAnimationFrame(() => {
                    wrapper.scrollLeft = scrollTop.scrollLeft;

                    requestAnimationFrame(() => {
                        sincronizandoScrollKanban = false;
                    });
                });
            },
            { passive: true }
        );

        wrapper.addEventListener(
            'scroll',
            () => {
                if (sincronizandoScrollKanban) return;

                sincronizandoScrollKanban = true;

                cancelAnimationFrame(rafScrollKanban);
                rafScrollKanban = requestAnimationFrame(() => {
                    scrollTop.scrollLeft = wrapper.scrollLeft;

                    requestAnimationFrame(() => {
                        sincronizandoScrollKanban = false;
                    });
                });
            },
            { passive: true }
        );

        window.addEventListener(
            'resize',
            atualizarLarguraScrollbar,
            { passive: true }
        );

        if ('ResizeObserver' in window) {
            resizeObserverKanban = new ResizeObserver(
                atualizarLarguraScrollbar
            );
            resizeObserverKanban.observe(wrapper);
        }
    }

    requestAnimationFrame(() => {
        requestAnimationFrame(atualizarLarguraScrollbar);
    });
}

async function pesquisarNoKanban(termo) {
    const box = document.getElementById('kanbanSearchResults');
    termo = String(termo || '').trim();
    if (termo.length < 2) { box.style.display = 'none'; box.innerHTML = ''; return; }
    try {
        const resposta = await fetch(`/api/kanban/pesquisar/?q=${encodeURIComponent(termo)}`);
        const dados = await resposta.json();
        const resultados = dados.resultados || [];
        box.innerHTML = resultados.length ? resultados.map(item => `
            <div class="kanban-result-item" onclick="localizarCardKanban(${item.id})">
                <strong>#${item.id} · ${escaparHtmlKanban(item.titulo)}</strong>
                <small>${escaparHtmlKanban(item.coluna_nome || 'Sem coluna')} ${item.lotes?.length ? `· Lote(s): ${item.lotes.map(escaparHtmlKanban).join(', ')}` : ''} ${item.destino ? `· Destino: ${escaparHtmlKanban(item.destino)}` : ''}</small>
            </div>`).join('') : '<div class="p-3 small text-muted">Nenhum card encontrado.</div>';
        box.style.display = 'block';
    } catch (erro) {
        console.error(erro);
        box.innerHTML = '<div class="p-3 small text-danger">Erro ao pesquisar.</div>';
        box.style.display = 'block';
    }
}
function escaparHtmlKanban(valor) {
    const div = document.createElement('div');
    div.textContent = valor ?? '';
    return div.innerHTML;
}
function localizarCardKanban(id) {
    const resultados = document.getElementById(
        'kanbanSearchResults'
    );

    if (resultados) {
        resultados.style.display = 'none';
    }

    const wrapper = document.getElementById(
        'kanbanBoard'
    );

    const card = document.querySelector(
        `[data-card-id="${id}"]`
    );

    if (!wrapper || !card) return;

    const coluna = card.closest(
        '.kanban-column'
    );

    if (!coluna) return;

    /*
     * Não usamos scrollIntoView().
     * Ele pode deslocar o BODY inteiro.
     * Movemos somente o scroll interno do Kanban.
     */
    const colunaLeft = coluna.offsetLeft;
    const colunaWidth = coluna.offsetWidth;
    const viewportWidth = wrapper.clientWidth;

    const destinoHorizontal = Math.max(
        0,
        colunaLeft
        - ((viewportWidth - colunaWidth) / 2)
    );

    wrapper.scrollTo({
        left: destinoHorizontal,
        behavior: 'smooth'
    });

    const corpoColuna = card.closest(
        '.kanban-column-body'
    );

    if (corpoColuna) {
        const destinoVertical = Math.max(
            0,
            card.offsetTop
            - (corpoColuna.clientHeight / 2)
            + (card.offsetHeight / 2)
        );

        corpoColuna.scrollTo({
            top: destinoVertical,
            behavior: 'smooth'
        });
    }

    card.classList.remove(
        'search-highlight'
    );

    void card.offsetWidth;

    card.classList.add(
        'search-highlight'
    );

    setTimeout(
        () => card.classList.remove(
            'search-highlight'
        ),
        1700
    );
}

let cardTagsKanbanId = null;
let tagsSelecionadasKanban = new Set();

function getCookieKanban(nome) { return getCookie(nome); }

function todosCardsKanban() {
    if (!kanbanData?.colunas) return [];
    return kanbanData.colunas.flatMap(coluna => coluna.cards || []);
}

function abrirTagsKanban(cardId) {
    const card = todosCardsKanban().find(item => Number(item.id) === Number(cardId));
    if (!card) { alert('Card não encontrado.'); return; }
    cardTagsKanbanId = Number(cardId);
    tagsSelecionadasKanban = new Set((card.tags || []).map(tag => Number(tag.id)));
    document.getElementById('tagCardTitulo').textContent = `Card #${card.id} · ${card.titulo}`;
    renderizarTagsKanban();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTagsKanban')).show();
}

function renderizarTagsKanban() {
    const grid = document.getElementById('tagSelectorGrid');
    if (!grid) return;
    const tags = kanbanData?.tags_disponiveis || [];
    if (!tags.length) {
        grid.innerHTML = `<div class="tag-empty-state"><i class="fas fa-tags d-block mb-2"></i>Nenhuma tag cadastrada. Crie a primeira abaixo.</div>`;
        return;
    }
    grid.innerHTML = tags.map(tag => {
        const selecionada = tagsSelecionadasKanban.has(Number(tag.id));
        return `<span class="tag-selector-item ${selecionada ? 'selected' : ''}" style="background:${escaparHtmlKanban(tag.cor || '#2f8f4e')};color:${escaparHtmlKanban(tag.cor_texto || '#ffffff')};" onclick="alternarTagKanban(${Number(tag.id)})" title="Clique para ${selecionada ? 'remover' : 'adicionar'}">${tag.icone ? `<i class="${escaparHtmlKanban(tag.icone)}"></i>` : ''}${escaparHtmlKanban(tag.nome)}</span>`;
    }).join('');
}

function alternarTagKanban(tagId) {
    tagId = Number(tagId);
    tagsSelecionadasKanban.has(tagId) ? tagsSelecionadasKanban.delete(tagId) : tagsSelecionadasKanban.add(tagId);
    renderizarTagsKanban();
}

async function salvarTagsKanban() {
    if (!cardTagsKanbanId) return;
    try {
        const resposta = await fetch(`/api/solicitacoes/${cardTagsKanbanId}/tags/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ tags_ids: [...tagsSelecionadasKanban] }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok || !dados.success) throw new Error(dados.error || 'Não foi possível salvar as tags.');
        bootstrap.Modal.getInstance(document.getElementById('modalTagsKanban'))?.hide();
        await recarregarKanban();
    } catch (erro) { alert(`❌ ${erro.message}`); }
}

async function criarTagKanban() {
    const nomeInput = document.getElementById('novaTagNomeKanban');
    const iconeInput = document.getElementById('novaTagIconeKanban');
    const corInput = document.getElementById('novaTagCorKanban');
    const nome = nomeInput.value.trim();
    const icone = iconeInput.value.trim();
    const cor = corInput.value;
    if (!nome) { alert('Digite o texto da tag.'); nomeInput.focus(); return; }
    try {
        const resposta = await fetch('/api/kanban/tags/criar/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ nome, icone, cor }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok || !dados.success) throw new Error(dados.error || 'Não foi possível criar a tag.');
        if (!Array.isArray(kanbanData.tags_disponiveis)) kanbanData.tags_disponiveis = [];
        const indice = kanbanData.tags_disponiveis.findIndex(tag => Number(tag.id) === Number(dados.tag.id));
        if (indice >= 0) kanbanData.tags_disponiveis[indice] = dados.tag;
        else kanbanData.tags_disponiveis.push(dados.tag);
        tagsSelecionadasKanban.add(Number(dados.tag.id));
        nomeInput.value = ''; iconeInput.value = ''; corInput.value = '#2f8f4e';
        renderizarTagsKanban();
    } catch (erro) { alert(`❌ ${erro.message}`); }
}

function gerarImpressaoSolicitacao(id) {
    const win = window.open('', '_blank', 'width=1350,height=900');
    if (!win) {
        alert('Permita pop-ups para abrir a impressão.');
        return;
    }

    win.document.write(`
        <!doctype html>
        <html lang="pt-BR">
        <head><meta charset="utf-8"><title>Carregando...</title></head>
        <body style="font-family:Arial;text-align:center;padding:60px;color:#1f5d35;">
            <div style="width:42px;height:42px;margin:0 auto 14px;border:5px solid #dcece2;border-top-color:#2f8f4e;border-radius:50%;animation:girar .8s linear infinite;"></div>
            <h3 style="margin:0">Preparando relatório...</h3>
            <style>@keyframes girar{to{transform:rotate(360deg)}}</style>
        </body></html>
    `);

    fetch(`/api/solicitacoes/${Number(id)}/impressao/`)
        .then(async response => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.error || 'Erro ao carregar.');
            return data;
        })
        .then(data => {
            const sol = data.solicitacao || {};
            const itens = [
                ...(data.itens_pendentes || []).map(item => ({ ...item, situacao: item.situacao || 'PENDENTE' })),
                ...(data.itens_processados || [])
            ];

            const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
            const isKg = sol.unidade_controle === 'QUILOGRAMA';

            /*
             * Unidade exibida no relatório:
             *
             * - somente BAG  -> BAG
             * - somente SC   -> SC
             * - BAG + SC     -> BAG/SC
             *
             * A informação vem dos próprios itens selecionados,
             * preservando a embalagem registrada no empenho.
             */
            const normalizarEmbalagem = valor => {
                const texto = String(
                    valor ?? ''
                )
                    .trim()
                    .toUpperCase();

                if (
                    texto === 'BAG'
                    || texto === 'BAGS'
                    || texto === 'BIG BAG'
                    || texto === 'BIGBAG'
                ) {
                    return 'BAG';
                }

                if (
                    texto === 'SC'
                    || texto === 'SACO'
                    || texto === 'SACOS'
                ) {
                    return 'SC';
                }

                return texto;
            };

            const embalagensEncontradas = [
                ...new Set(
                    itens
                        .map(item => (
                            normalizarEmbalagem(
                                item.embalagem
                            )
                        ))
                        .filter(Boolean)
                )
            ];

            /*
             * Garante sempre BAG antes de SC:
             * BAG/SC
             * e não SC/BAG dependendo da ordem dos itens.
             */
            embalagensEncontradas.sort(
                (a, b) => {
                    const ordem = {
                        'BAG': 1,
                        'SC': 2
                    };

                    return (
                        (ordem[a] ?? 99)
                        - (ordem[b] ?? 99)
                    );
                }
            );

            const unidadeEmbalagem = (
                embalagensEncontradas.length
                    ? embalagensEncontradas.join('/')
                    : 'BAGS/SC'
            );

            const unidade = (
                isKg
                    ? 'KG'
                    : unidadeEmbalagem
            );

            const num = v => Number(v || 0).toLocaleString(
                'pt-BR',
                {
                    minimumFractionDigits: (
                        isKg
                            ? 2
                            : 0
                    ),
                    maximumFractionDigits: 2
                }
            );
            const qtdEmp = sol.quantidade_empenhada_display ?? sol.quantidade_empenhada ?? 0;
            const totalItens = itens.reduce((s, i) => s + Number(i.quantidade || 0), 0);
            const destino = sol.destino || '';
            const observacao = sol.observacao || '';
            const criteriosSecundarios = [
                sol.criterios?.produto ? `Produto: ${sol.criterios.produto}` : '',
                sol.criterios?.especie ? `Espécie: ${sol.criterios.especie}` : '',
                sol.criterios?.cliente ? `Cliente: ${sol.criterios.cliente}` : ''
            ].filter(Boolean);

            const statusClasse = sol.status === 'CONCLUIDO' ? 'status-concluido' : sol.status === 'CANCELADO' ? 'status-cancelado' : 'status-andamento';

.folha { width: 297mm; min-height: 210mm; margin: 0 auto; padding: 8mm; background: #fff; box-shadow: 0 15px 50px rgba(0,0,0,.18); }
.topo { display: grid; grid-template-columns: 1fr 165px; overflow: hidden; border: 1px solid #256f40; border-radius: 14px 14px 0 0; page-break-inside: avoid; }
.topo-principal { position: relative; min-width: 0; padding: 13px 16px; color: #fff; background: linear-gradient(135deg, #174d2c 0%, #2f8f4e 62%, #59b875 100%); }
.topo-principal::after { content: ""; position: absolute; width: 145px; height: 145px; right: -55px; top: -80px; border-radius: 50%; background: rgba(255,255,255,.09); }
.topo-principal h1 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: .45px; }
.topo-principal p { max-width: 95%; margin: 5px 0 0; overflow: hidden; color: rgba(255,255,255,.88); font-size: 9px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.numero-card { display: flex; flex-direction: column; justify-content: center; padding: 10px 13px; text-align: right; border-left: 1px solid #c8dfcf; background: linear-gradient(180deg, #f3fbf6, #e9f6ed); }
.numero-card small { color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; }
.numero-card strong { margin-top: 2px; color: var(--verde-escuro); font-size: 22px; font-weight: 900; white-space: nowrap; }
.resumo { display: grid; grid-template-columns: minmax(190px,1.25fr) repeat(3, minmax(135px,.55fr)); border: 1px solid var(--borda); border-top: 0; page-break-inside: avoid; }
.indicador { position: relative; min-height: 64px; padding: 10px 11px; overflow: hidden; border-right: 1px solid var(--borda); background: #fff; }
.indicador:last-child { border-right: 0; }
.indicador::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.indicador b { display: block; margin-bottom: 6px; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .35px; text-transform: uppercase; }
.indicador strong { display: block; overflow: hidden; color: #213b2a; font-size: 15px; font-weight: 900; white-space: nowrap; text-overflow: ellipsis; }
.indicador-status { background: linear-gradient(135deg, #f4faf6, #fff); }
.indicador-status::before { background: var(--verde); }
.indicador-solicitado { background: linear-gradient(135deg, var(--azul-claro), #fff); }
.indicador-solicitado::before { background: var(--azul); }
.indicador-empenhado { background: linear-gradient(135deg, var(--amarelo-claro), #fff); }
.indicador-empenhado::before { background: var(--amarelo); }
.indicador-movimentado { background: linear-gradient(135deg, var(--verde-claro), #fff); }
.indicador-movimentado::before { background: var(--verde); }
.info-grid { display: grid; grid-template-columns: minmax(170px,1.1fr) repeat(3, minmax(145px,.62fr)); border: 1px solid var(--borda); border-top: 0; page-break-inside: avoid; }
.info { min-height: 49px; padding: 8px 10px; overflow: hidden; border-right: 1px solid var(--borda); }
.info:last-child { border-right: 0; }
.info b { display: block; margin-bottom: 5px; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .35px; text-transform: uppercase; }
.info span { display: block; overflow: hidden; font-size: 10px; font-weight: 750; white-space: nowrap; text-overflow: ellipsis; }
.linha-destino-obs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--borda); border-top: 0; page-break-inside: avoid; }
.box-destino { position: relative; min-height: 53px; padding: 9px 11px 9px 16px; background: linear-gradient(135deg, #eaf8ef, #fff); border-right: 1px solid var(--borda); }
.box-destino::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--verde); }
.box-destino b, .box-obs b { display: block; margin-bottom: 5px; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .35px; text-transform: uppercase; }
.box-destino span, .box-obs span { display: block; font-size: 10px; font-weight: 800; line-height: 1.28; overflow-wrap: anywhere; }
.box-obs { position: relative; min-height: 53px; padding: 9px 11px 9px 16px; background: linear-gradient(135deg, var(--amarelo-claro), #fff); }
.box-obs::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--amarelo); }
.criterios { padding: 7px 10px; border: 1px solid var(--borda); border-top: 0; color: #526159; background: #f8faf9; font-size: 9px; line-height: 1.3; page-break-inside: avoid; }
.criterios b { color: var(--verde-escuro); }
.titulo-itens { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0 6px; color: var(--verde-escuro); font-size: 10px; font-weight: 900; text-transform: uppercase; page-break-after: avoid; }
.tabela-container { overflow: hidden; border: 1px solid var(--borda); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 7.7px; }
thead { display: table-header-group; }
tfoot { display: table-footer-group; }
th { padding: 6px 4px; color: #fff; background: linear-gradient(135deg, #205f37, #2f8f4e); border-right: 1px solid #75a986; font-size: 7.3px; font-weight: 900; text-align: left; text-transform: uppercase; white-space: nowrap; }
td { padding: 5px 4px; border-right: 1px solid #d6dfd8; border-bottom: 1px solid #d6dfd8; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th:last-child, td:last-child { border-right: 0; }
tbody tr:nth-child(even) { background: #f6faf7; }
tr { page-break-inside: avoid; }
.col-num { width: 27px; text-align: center; } .col-status { width: 78px; } .col-lote { width: 105px; } .col-qtd { width: 52px; text-align: center; }
.col-produto { width: 138px; } .col-cultivar { width: 113px; } .col-peneira { width: 55px; text-align: center; } .col-armazem { width: 86px; }
.col-endereco { width: 112px; } .col-cliente { width: 116px; }
.badge-situacao { display: inline-block; max-width: 100%; padding: 3px 6px; overflow: hidden; border-radius: 999px; font-size: 6.8px; font-weight: 900; white-space: nowrap; text-overflow: ellipsis; }
.badge-pendente { color: #795900; background: #ffefad; }
.badge-transferido { color: #176039; background: #d8f1e1; }
.badge-expedido { color: #16536f; background: #d9edf8; }
.total td { color: #203a29; background: #e7f3eb; font-weight: 900; }
.status-concluido { color: #176039; } .status-cancelado { color: #a12731; } .status-andamento { color: #285b39; }
.rodape { display: flex; justify-content: space-between; gap: 12px; margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--borda); color: var(--muted); font-size: 8px; white-space: nowrap; page-break-inside: avoid; }
.acoes { margin-top: 15px; text-align: center; }
.acoes button { margin: 3px; padding: 10px 19px; border: 0; border-radius: 9px; cursor: pointer; font-weight: 850; }
.botao-imprimir { color: #fff; background: linear-gradient(135deg, #2f8f4e, #1d5d34); }
.botao-fechar { color: #26372d; background: #e3ebe5; }
@media print {
  @page { size: A4 landscape; margin: 5mm; }
  html, body { width: 297mm; background: #fff; }
  body { padding: 0; }
  .folha { width: 287mm; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
  .acoes { display: none !important; }
  .topo, .resumo, .info-grid, .linha-destino-obs, .criterios, .rodape { break-inside: avoid !important; }
  thead { display: table-header-group; }
  tr, td, th { break-inside: avoid !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body>
<main class="folha">
  <header class="topo">
    <div class="topo-principal">
      <h1>RELATÓRIO DE SOLICITAÇÃO</h1>
      <p>${esc(sol.titulo || 'Solicitação')}</p>
    </div>
    <div class="numero-card">
      <small>Solicitação</small>
      <strong>#${esc(sol.id)}</strong>
    </div>
  </header>

  <section class="resumo">
    <div class="indicador indicador-status"><b>Status</b><strong class="${statusClasse}">${esc(sol.status_display || sol.status || '-')}</strong></div>
    <div class="indicador indicador-solicitado"><b>Quantidade solicitada</b><strong>${num(sol.quantidade_solicitada)} ${unidade}</strong></div>
    <div class="indicador indicador-empenhado"><b>Quantidade empenhada</b><strong>${num(qtdEmp)} ${unidade}</strong></div>
    <div class="indicador indicador-movimentado"><b>Quantidade movimentada</b><strong>${num(sol.quantidade_movimentada)} ${unidade}</strong></div>
  </section>

  <section class="info-grid">
    <div class="info"><b>Criado por</b><span>${esc(sol.criador || '-')}</span></div>
    <div class="info"><b>Criação</b><span>${esc(sol.data_criacao || '-')}</span></div>
    <div class="info"><b>Atualização</b><span>${esc(sol.data_atualizacao || '-')}</span></div>
    <div class="info"><b>Finalização</b><span>${esc(sol.data_finalizacao || '-')}</span></div>
  </section>

  <!-- LINHA UNICA: DESTINO E OBSERVACAO LADO A LADO -->
  <section class="linha-destino-obs">
    <div class="box-destino">
      <b>Destino</b>
      <span>${esc(destino || 'Não informado')}</span>
    </div>
    <div class="box-obs">
      <b>Observação</b>
      <span>${esc(observacao || 'Nenhuma observação.')}</span>
    </div>
  </section>

  ${criteriosSecundarios.length ? `<section class="criterios"><b>Critérios:</b> ${esc(criteriosSecundarios.join(' · '))}</section>` : ''}

  <div class="titulo-itens">
    <span>Itens da solicitação</span>
    <span>${itens.length} registro(s) · Total ${num(totalItens)} ${unidade}</span>
  </div>

  <div class="tabela-container">
    ${itens.length ? `<table>
      <thead><tr><th class="col-num">#</th><th class="col-status">Situação</th><th class="col-lote">Lote</th><th class="col-qtd">Qtd.</th><th class="col-produto">Produto</th><th class="col-cultivar">Cultivar</th><th class="col-peneira">Peneira</th><th class="col-armazem">Armazém</th><th class="col-endereco">Endereço</th><th class="col-cliente">Cliente</th></tr></thead>
      <tbody>${itens.map((item, idx) => {
        const situacao = String(item.situacao || 'PENDENTE').toUpperCase();
        const classe = situacao.includes('TRANSF') ? 'badge-transferido' : situacao.includes('EXPED') ? 'badge-expedido' : 'badge-pendente';
        const armazemItem = item.armazem || '';
        const endereco = item.endereco_destino || item.endereco || '';
        return `<tr>
          <td class="col-num">${idx+1}</td>
          <td class="col-status"><span class="badge-situacao ${classe}">${esc(situacao)}</span></td>
          <td class="col-lote"><strong>${esc(item.lote || '-')}</strong></td>
          <td class="col-qtd">${num(item.quantidade)}</td>
          <td class="col-produto">${esc(item.produto || '-')}</td>
          <td class="col-cultivar">${esc(item.cultivar || '-')}</td>
          <td class="col-peneira">${esc(item.peneira || '-')}</td>
          <td class="col-armazem">${esc(armazemItem || '-')}</td>
          <td class="col-endereco">${esc(endereco || '-')}</td>
          <td class="col-cliente">${esc(item.cliente || '-')}</td>
        </tr>`;
      }).join('')}</tbody>
      <tfoot><tr class="total"><td colspan="3" style="text-align:right">TOTAL</td><td class="col-qtd">${num(totalItens)}</td><td colspan="6"></td></tr></tfoot>
    </table>` : '<div style="padding:28px;color:#718078;text-align:center;">Nenhum item registrado.</div>'}
  </div>

  <footer class="rodape">
    <span>INFINITY STOCK · Sistema de Controle de Estoque</span>
    <span>Documento gerado em ${esc(data.emitido_em || '-')}</span>
  </footer>

  <div class="acoes">
    <button type="button" class="botao-imprimir" onclick="window.print()">Imprimir</button>
    <button type="button" class="botao-fechar" onclick="window.close()">Fechar</button>
  </div>
</main>
</body></html>`);
            win.document.close();
        })
        .catch(erro => {
            win.document.body.innerHTML = `<div style="max-width:650px;margin:60px auto;padding:25px;border:1px solid #efc4c8;border-radius:14px;background:#fff4f5;color:#a32e39;font-family:Arial;text-align:center;"><h3>Não foi possível gerar o relatório</h3><p>${String(erro.message || erro)}</p></div>`;
        });
}
function imprimirCardKanban(id) {
    gerarImpressaoSolicitacao(id);
}
</script>
{% endblock %}
