{% extends 'sapp/base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --kanban-bg: #f1f5f9;
        --verde: #2f8f4e;
        --verde-escuro: #1e5f34;
    }

    .kanban-wrapper {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding: 16px 8px 24px 8px;
        min-height: calc(100vh - 180px);
        align-items: flex-start;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        padding-left: 16px; /* garante que a primeira coluna não fique cortada */
    }

    .kanban-column {
        min-width: 300px;
        max-width: 340px;
        flex: 0 0 auto;
        background: var(--kanban-bg);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 200px);
        scroll-snap-align: start;
        margin: 0;
    }

    .kanban-column-header {
        padding: 12px 16px;
        border-radius: 16px 16px 0 0;
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .kanban-column-body {
        padding: 10px;
        overflow-y: auto;
        flex: 1;
    }

    .kanban-card {
        background: white;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        cursor: grab;
        transition: all 0.2s;
        border-left: 4px solid transparent;
        position: relative;
    }
    .kanban-card:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        transform: translateY(-2px);
    }
    .kanban-card:active {
        cursor: grabbing;
        opacity: 0.8;
    }
    .kanban-card.dragging {
        opacity: 0.5;
        transform: rotate(2deg) scale(0.95);
    }
    .kanban-card.drag-over {
        border: 2px dashed var(--verde);
        background: #f0fdf4;
    }

    .kanban-card.prioridade-URGENTE { border-left-color: #dc3545; }
    .kanban-card.prioridade-ALTA { border-left-color: #fd7e14; }
    .kanban-card.prioridade-MEDIA { border-left-color: #ffc107; }
    .kanban-card.prioridade-BAIXA { border-left-color: #6c757d; }

    .card-prioridade-badge {
        position: absolute;
        top: 6px;
        right: 6px;
        font-size: 0.5rem;
        padding: 2px 6px;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .card-status-badge {
        font-size: 0.55rem;
        padding: 2px 6px;
        border-radius: 8px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 4px;
    }

    .card-progress {
        height: 4px;
        background: #e9ecef;
        border-radius: 2px;
        margin: 6px 0;
        overflow: hidden;
    }
    .card-progress-bar {
        height: 100%;
        border-radius: 2px;
        transition: width 0.5s ease;
    }

    .card-actions {
        display: flex;
        gap: 4px;
        margin-top: 6px;
        flex-wrap: wrap;
    }
    .card-actions .btn {
        font-size: 0.6rem;
        padding: 3px 8px;
    }

    .coluna-drop-zone {
        min-height: 60px;
        border: 2px dashed transparent;
        border-radius: 8px;
        transition: all 0.3s;
    }
    .coluna-drop-zone.active {
        border-color: var(--verde);
        background: rgba(47, 143, 78, 0.05);
    }

    .empty-column {
        text-align: center;
        color: #94a3b8;
        padding: 20px 10px;
        font-size: 0.75rem;
    }

    /* Ajustes para telas grandes */
    @media (min-width: 1200px) {
        .kanban-wrapper {
            justify-content: flex-start;
            padding-left: 24px;
            padding-right: 24px;
        }
        .kanban-column {
            min-width: 320px;
            max-width: 380px;
        }
    }

    /* Ajustes para dispositivos móveis */
    @media (max-width: 768px) {
        .kanban-wrapper {
            gap: 12px;
            padding: 12px 6px 24px 6px;
            padding-left: 12px;
        }
        .kanban-column {
            min-width: 260px;
            max-width: 300px;
        }
        .kanban-card {
            padding: 10px;
        }
        .card-actions .btn {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
    }

    /* Modal de mover card (estilos simples para o modal) */
    .modal-mover-lista .list-group-item {
        cursor: pointer;
        transition: background 0.2s;
    }
    .modal-mover-lista .list-group-item:hover {
        background: #f1f5f9;
    }
</style>


<div class="container-fluid py-2">
    <!-- HEADER -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h5 class="mb-0">
                <i class="fas fa-columns text-primary me-2"></i>Kanban
            </h5>
            <small class="text-muted">A movimentação dos cards entre colunas e automatica</small>
        </div>
        <div class="d-flex gap-2">
            <a href="{% url 'sapp:pagina_solicitacoes' %}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-list me-1"></i> Lista
            </a>
            <a href="{% url 'sapp:pagina_config_workflow' %}" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-cog me-1"></i> Configurar
            </a>
            <button class="btn btn-outline-success btn-sm" onclick="recarregarKanban()">
                <i class="fas fa-sync-alt me-1"></i> Atualizar
            </button>
        </div>
    </div>

    <!-- KANBAN BOARD -->
    <div class="kanban-wrapper" id="kanbanBoard">
        <div class="text-center py-5 w-100">
            <div class="spinner-border text-success mb-3" role="status"></div>
            <h5 class="text-muted">Carregando Kanban...</h5>
        </div>
    </div>
</div>

<!-- MODAL MOVER CARD -->
<div class="modal fade" id="modalMoverCard" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h6 class="modal-title"><i class="fas fa-arrows-alt me-2"></i>Mover Card</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted mb-2">Selecione a coluna de destino:</p>
                <div class="list-group" id="listaColunasDestino"></div>
                <div class="mt-3">
                    <label class="form-label small">Observação (opcional)</label>
                    <textarea id="obsMoverCard" class="form-control form-control-sm" rows="2" 
                              placeholder="Motivo da movimentação..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-primary" id="btnConfirmarMover" onclick="confirmarMoverCard()">
                    <i class="fas fa-check me-1"></i> Mover
                </button>
            </div>
        </div>
    </div>
</div>


<audio id="audioNotificacao" preload="auto" style="display:none;" src=""></audio>
<script>
// ============================================================
// KANBAN COMPLETO COM DRAG & DROP + IMPRESSÃO
// ============================================================

let kanbanData = null;
let cardArrastado = null;
let colunaOrigem = null;
let cardParaMover = null;

document.addEventListener('DOMContentLoaded', carregarKanban);

async function carregarKanban() {
    try {
        const resp = await fetch('/api/kanban/dados/');
        const data = await resp.json();
        if (data.success) {
            kanbanData = data;
            renderizarKanban(data.colunas);
        }
    } catch (e) {
        console.error('Erro ao carregar Kanban:', e);
        document.getElementById('kanbanBoard').innerHTML = `
            <div class="text-center py-5 w-100 text-danger">
                <i class="fas fa-exclamation-circle fa-3x mb-3"></i>
                <h5>Erro ao carregar Kanban</h5>
            </div>
        `;
    }
}

function renderizarKanban(colunas) {
    const board = document.getElementById('kanbanBoard');
    board.innerHTML = '';
    colunas.forEach(coluna => {
        const colEl = document.createElement('div');
        colEl.className = 'kanban-column';
        colEl.dataset.colunaId = coluna.id;
        colEl.dataset.colunaNome = coluna.nome;
        colEl.innerHTML = `
            <div class="kanban-column-header" style="background: ${coluna.cor};">
                <span><i class="fas fa-circle me-2" style="font-size: 0.5rem;"></i>${coluna.nome}</span>
                <span class="badge bg-light text-dark">${coluna.total}</span>
            </div>
            <div class="kanban-column-body coluna-drop-zone" 
                 data-coluna-id="${coluna.id}"
                 ondragover="handleDragOver(event)" 
                 ondragleave="handleDragLeave(event)" 
                 ondrop="handleDrop(event)">
                ${coluna.cards.length === 0 ? 
                    '<div class="empty-column"><i class="fas fa-inbox fa-2x d-block mb-2 opacity-50"></i>Vazio</div>' : 
                    coluna.cards.map(card => criarCardHTML(card)).join('')
                }
            </div>
        `;
        board.appendChild(colEl);
    });
    document.querySelectorAll('.kanban-card').forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
    });
}

function criarCardHTML(card) {
    const prioridadeClass = `prioridade-${card.prioridade}`;
    const unidade = card.unidade_controle || 'UN';
    const qtdEmp = card.quantidade_empenhada_display ?? card.quantidade_empenhada ?? 0;
    const percentual = card.percentual_empenhado ?? 
        (card.quantidade_solicitada > 0 ? (card.quantidade_empenhada / card.quantidade_solicitada) * 100 : 0);
    const qtdFormatada = unidade === 'QUILOGRAMA' ? Number(qtdEmp).toFixed(2) : Math.round(qtdEmp);
    const percentualFormatado = Math.round(percentual);
    
    const statusColors = {
        'AGUARDANDO_EMPENHO': '#fff3cd',
        'EMPENHO_PARCIAL': '#cce5ff',
        'EMPENHO_COMPLETO': '#d4edda',
        'MOVIMENTACAO_PARCIAL': '#d1ecf1',
        'CONCLUIDO': '#d4edda',
        'CANCELADO': '#f8d7da',
    };
    const prioridadeBadgeColor = {
        'URGENTE': 'danger',
        'ALTA': 'warning',
        'MEDIA': 'secondary',
        'BAIXA': 'secondary'
    };
    return `
        <div class="kanban-card ${prioridadeClass}" 
             draggable="true" 
             data-card-id="${card.id}"
             data-card-titulo="${card.titulo}">
            <span class="card-prioridade-badge bg-${prioridadeBadgeColor[card.prioridade] || 'secondary'} text-${card.prioridade === 'ALTA' ? 'dark' : 'white'}">
                ${card.prioridade}
            </span>
            <h6 class="mb-1 pe-4" style="font-size:0.8rem;">${card.titulo}</h6>
            <span class="card-status-badge" style="background: ${statusColors[card.status] || '#f8f9fa'};">
                ${card.status_display || card.status}
            </span>
            <div class="card-progress">
                <div class="card-progress-bar ${percentual >= 100 ? 'bg-success' : percentual >= 50 ? 'bg-warning' : 'bg-danger'}" 
                     style="width: ${percentual}%"></div>
            </div>
            <div class="small text-muted">
                <div>📦 ${qtdFormatada}/${card.quantidade_solicitada} ${unidade === 'QUILOGRAMA' ? 'KG' : unidade}</div>
                <div>👤 ${card.criador_nome}</div>
                <div>📅 ${card.data_criacao}</div>
            </div>
            ${card.criterios.armazem ? `<span class="badge bg-light text-dark me-1">🏭 ${card.criterios.armazem}</span>` : ''}
            ${card.criterios.cliente ? `<span class="badge bg-light text-dark">👤 ${card.criterios.cliente}</span>` : ''}
            <div class="card-actions">
                <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); abrirModalMover(${card.id}, '${card.titulo.replace(/'/g, "\\'")}')" title="Mover card">
                    <i class="fas fa-arrows-alt"></i>
                </button>
                <button class="btn btn-sm btn-outline-info" onclick="event.stopPropagation(); imprimirCardKanban(${card.id})" title="Imprimir / Visualizar">
                    <i class="fas fa-print"></i>
                </button>
            </div>
        </div>
    `;
}

// ============================================================
// DRAG & DROP
// ============================================================
function handleDragStart(e) {
    cardArrastado = this;
    colunaOrigem = this.closest('.kanban-column').dataset.colunaId;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.cardId);
}
function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.coluna-drop-zone.active').forEach(zone => zone.classList.remove('active'));
    cardArrastado = null;
    colunaOrigem = null;
}
function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('active');
}
function handleDragLeave(e) {
    this.classList.remove('active');
}
async function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('active');
    const cardId = e.dataTransfer.getData('text/plain');
    const colunaDestinoId = this.dataset.colunaId;
    if (colunaDestinoId === colunaOrigem) return;
    if (cardArrastado) this.appendChild(cardArrastado);
    await moverCardAPI(cardId, colunaDestinoId);
    setTimeout(recarregarKanban, 500);
}

// ============================================================
// MODAL MOVER CARD
// ============================================================
function abrirModalMover(cardId, cardTitulo) {
    cardParaMover = cardId;
    const lista = document.getElementById('listaColunasDestino');
    lista.innerHTML = '';
    if (!kanbanData || !kanbanData.colunas_disponiveis) {
        lista.innerHTML = '<div class="text-muted small p-2">Carregando...</div>';
        return;
    }
    kanbanData.colunas_disponiveis.forEach(coluna => {
        const item = document.createElement('div');
        item.className = 'list-group-item list-group-item-action d-flex align-items-center gap-2';
        item.innerHTML = `
            <span style="width: 12px; height: 12px; border-radius: 50%; background: ${coluna.cor}; flex-shrink: 0;"></span>
            <span>${coluna.nome}</span>
        `;
        item.onclick = () => {
            document.querySelectorAll('#listaColunasDestino .active').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            item.dataset.colunaId = coluna.id;
        };
        lista.appendChild(item);
    });
    document.getElementById('obsMoverCard').value = '';
    new bootstrap.Modal(document.getElementById('modalMoverCard')).show();
}
async function confirmarMoverCard() {
    const itemAtivo = document.querySelector('#listaColunasDestino .active');
    if (!itemAtivo) { alert('Selecione uma coluna de destino'); return; }
    const colunaDestinoId = itemAtivo.dataset.colunaId;
    const observacao = document.getElementById('obsMoverCard').value;
    await moverCardAPI(cardParaMover, colunaDestinoId, observacao);
    bootstrap.Modal.getInstance(document.getElementById('modalMoverCard')).hide();
    recarregarKanban();
}

// ============================================================
// API
// ============================================================
async function moverCardAPI(cardId, colunaDestinoId, observacao = '') {
    try {
        const resp = await fetch(`/api/solicitacoes/${cardId}/mover-kanban/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ coluna_id: colunaDestinoId, observacao })
        });
        const data = await resp.json();
        if (data.success) mostrarToast(`✅ Card movido para "${data.coluna_nova}"`);
        else alert('❌ ' + (data.error || 'Erro ao mover card'));
    } catch (e) {
        console.error('Erro ao mover card:', e);
        alert('Erro ao mover card');
    }
}
function recarregarKanban() { carregarKanban(); }

// ============================================================
// IMPRESSÃO (MESMA FUNÇÃO DA PÁGINA DE SOLICITAÇÕES)
// ============================================================
function imprimirCardKanban(id) {
    const win = window.open('', '_blank', 'width=1000,height=700');
    win.document.write(`
        <html><head><title>Carregando...</title></head>
        <body style="text-align:center;padding-top:50px;font-family:sans-serif;">
            <h3>⏳ Carregando relatório...</h3>
        </body></html>
    `);
    fetch(`/api/solicitacoes/${id}/impressao/`)
        .then(r => r.json())
        .then(data => {
            if (!data.success) { win.document.body.innerHTML = '<h3 style="color:red;">Erro ao carregar dados</h3>'; return; }
            const sol = data.solicitacao;
            const pendentes = data.itens_pendentes || [];
            const processados = data.itens_processados || [];
            const todos = [...pendentes.map(i=>({...i,situacao:'PENDENTE'})), ...processados];
            
            // 🔁 Calcular totais em KG se a unidade for KG
            const isKg = sol.unidade_controle === 'QUILOGRAMA';
            let totalUnidades = 0, totalKg = 0;
            todos.forEach(item => {
                const qtd = item.quantidade || 0;
                totalUnidades += qtd;
                if (isKg && item.peso_unitario) {
                    totalKg += qtd * parseFloat(item.peso_unitario);
                }
            });
            // Para exibição, se for KG, usar totalKg; senão, totalUnidades
            const totalExibicao = isKg ? totalKg.toFixed(2) : totalUnidades;
            const unidadeExibicao = isKg ? 'KG' : (sol.unidade_controle || 'un');

            // Valores do resumo em KG
            const qtdSolicitada = sol.quantidade_solicitada || 0;
            let qtdEmpenhada = sol.quantidade_empenhada || 0;
            let qtdMovimentada = sol.quantidade_movimentada || 0;
            if (isKg) {
                // Converter empenhado e movimentado para KG a partir dos itens
                let empKg = 0, movKg = 0;
                // Itens pendentes contribuem para o empenhado
                pendentes.forEach(i => {
                    const q = i.quantidade || 0;
                    const p = parseFloat(i.peso_unitario || 0);
                    empKg += q * p;
                });
                // Itens processados (transferidos/expedidos) contribuem para o movimentado e também já foram empenhados
                processados.forEach(i => {
                    const q = i.quantidade || 0;
                    const p = parseFloat(i.peso_unitario || 0);
                    movKg += q * p;
                    empKg += q * p; // processados já estavam empenhados
                });
                qtdEmpenhada = empKg.toFixed(2);
                qtdMovimentada = movKg.toFixed(2);
            }

            win.document.title = `Card #${sol.id} - ${sol.titulo}`;
            win.document.body.innerHTML = `
                <style>
                    *{margin:0;padding:0;box-sizing:border-box}
                    body{font-family:'Segoe UI',Arial,sans-serif;padding:20px;color:#1a202c;font-size:10px}
                    .header{text-align:center;border-bottom:3px solid #2f8f4e;padding-bottom:12px;margin-bottom:15px}
                    .header h2{color:#2f8f4e;font-size:18px}
                    .info-box{background:#f8f9fa;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:15px}
                    .info-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #e2e8f0;font-size:10px}
                    .info-row strong{color:#2f8f4e;min-width:130px}
                    table{width:100%;border-collapse:collapse;margin-top:12px;font-size:9px}
                    thead th{background:#2f8f4e;color:white;padding:6px 4px;text-align:left;font-weight:600;text-transform:uppercase;font-size:8px}
                    tbody td{padding:5px 4px;border-bottom:1px solid #e2e8f0}
                    .badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:7px;font-weight:700}
                    .badge-pendente{background:#fff3cd;color:#856404}
                    .badge-transferido{background:#d4edda;color:#155724}
                    .badge-expedido{background:#d1ecf1;color:#0c5460}
                    @media print{button{display:none!important}@page{margin:8mm}}
                </style>
                <div class="header"><h2>🧾 RELATÓRIO DE SOLICITAÇÃO</h2><p>Emitido em: ${new Date().toLocaleString('pt-BR')}</p></div>
                <div class="info-box">
                    <div class="info-row"><strong>Card:</strong><span>#${sol.id} - ${sol.titulo}</span></div>
                    <div class="info-row"><strong>Criador:</strong><span>${sol.criador||'---'}</span></div>
                    <div class="info-row"><strong>Data:</strong><span>${sol.data_criacao||'---'}</span></div>
                    <div class="info-row"><strong>Unidade:</strong><span>${sol.unidade_controle||'---'}</span></div>
                    <div class="info-row"><strong>Solicitado:</strong><span style="font-size:13px;font-weight:700;">${qtdSolicitada} ${unidadeExibicao}</span></div>
                    <div class="info-row"><strong>Empenhado:</strong><span style="color:#f59e0b;font-weight:700;">${qtdEmpenhada} ${unidadeExibicao}</span></div>
                    <div class="info-row"><strong>Movimentado:</strong><span style="color:#3b82f6;font-weight:700;">${qtdMovimentada} ${unidadeExibicao}</span></div>
                    <div class="info-row"><strong>Status:</strong><span>${sol.status||'---'}</span></div>
                </div>
                <h3 style="color:#2f8f4e;margin-bottom:8px;">📋 Itens (${todos.length}) - Total: ${totalExibicao} ${unidadeExibicao}</h3>
                ${todos.length>0?`<table><thead><tr><th>#</th><th>Situação</th><th>Lote</th><th>Qtd</th>${isKg?'<th>Peso Un.</th><th>Peso Total</th>':''}<th>Produto</th><th>Cultivar</th><th>Endereço</th><th>Cliente</th></tr></thead><tbody>${todos.map((item,idx)=>{ const qtd=item.quantidade||0; const peso=item.peso_unitario||0; const pesoTotal=isKg?qtd*peso:0; return `<tr><td>${idx+1}</td><td><span class="badge badge-${(item.situacao||'pendente').toLowerCase()}">${item.situacao||'PENDENTE'}</span></td><td><strong>${item.lote||'-'}</strong></td><td style="text-align:center;font-weight:700;">${qtd}</td>${isKg?`<td>${peso}</td><td>${pesoTotal.toFixed(2)}</td>`:''}<td>${item.produto||'-'}</td><td>${item.cultivar||'-'}</td><td>${item.endereco||'-'}</td><td>${item.cliente||'-'}</td></tr>`}).join('')}</tbody></table>`:'<p style="text-align:center;color:#94a3b8;padding:20px;">Nenhum item registrado</p>'}
                <div style="text-align:center;margin-top:15px;">
                    <button onclick="window.print()" style="padding:10px 25px;background:#2f8f4e;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;">🖨️ Imprimir</button>
                </div>
            `;
        })
        .catch(e => { win.document.body.innerHTML = '<h3 style="color:red;">Erro ao carregar relatório</h3>'; });
}

function mostrarToast(mensagem) {
    const toast = document.createElement('div');
    toast.className = 'alert alert-success position-fixed bottom-0 end-0 m-3';
    toast.style.zIndex = '99999';
    toast.style.animation = 'slideIn 0.3s ease';
    toast.innerHTML = mensagem;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function getCookie(name) {
    let v = null;
    if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(c => {
            const cookie = c.trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                v = decodeURIComponent(cookie.substring(name.length + 1));
            }
        });
    }
    return v;
}


// ==================== POLLING DE ATUALIZAÇÃO AO VIVO (KANBAN) ====================
let _ultimaVersaoKanban = null;
let _pollingIntervalKanban = null;

function iniciarPollingKanban() {
    if (_pollingIntervalKanban) clearInterval(_pollingIntervalKanban);
    _pollingIntervalKanban = setInterval(verificarAtualizacoesKanban, 5000); // 5 segundos
    console.log('✅ Polling do Kanban iniciado');
}

async function verificarAtualizacoesKanban() {
    try {
        const resp = await fetch('/api/cards/versao/');
        const data = await resp.json();
        if (!data.success) return;

        if (_ultimaVersaoKanban === null) {
            _ultimaVersaoKanban = data.version;
            return;
        }

        if (data.version !== _ultimaVersaoKanban) {
            console.log('🔄 Alteração detectada no Kanban!');
            _ultimaVersaoKanban = data.version;
            carregarKanban();

            // Tocar som (agora usando Web Audio API, funciona sem interação prévia)
            tocarBeep();
        }
    } catch (e) {
        console.error('Erro no polling do Kanban:', e);
    }
}

function tocarBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;

        [800, 1000].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = 0.3;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.15);
        });
    } catch(e) {
        console.log('Erro ao gerar som:', e);
    }
}
// Iniciar automaticamente após 5 segundos
setTimeout(iniciarPollingKanban, 5000);
