{% extends 'sapp/base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --kanban-bg: #f1f5f9;
        --verde: #2f8f4e;
        --verde-escuro: #1e5f34;
    }


    .kanban-scrollbar-top::-webkit-scrollbar {
        height: 14px;
    }

    .kanban-scrollbar-top::-webkit-scrollbar-thumb {
    background: linear-gradient(
        90deg,
        #2f8f4e,
        #4eaa68
    );

    border: 2px solid #d8e4db;
        border-radius: 999px;
    }
    /* ===== BARRA DE ROLAGEM SUPERIOR ===== */
    .kanban-scrollbar-top {
        
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        height: 8px;
        background: #d4e0d7;
        border-radius: 6px;
        margin-bottom: 10px;
        visibility: hidden;
        transition: visibility 0.2s;
    }
    .kanban-scrollbar-top.visible {
        visibility: visible;
    }
    .kanban-scrollbar-content {
        height: 1px;
    }

    /* ===== KANBAN WRAPPER ===== */
    .kanban-wrapper {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 4px 2px 20px 16px;
        min-height: calc(100vh - 250px);
        align-items: flex-start;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        scroll-padding-left: 16px;
    }

    .kanban-column {
        min-width: 322px;
        max-width: 350px;
        flex: 0 0 auto;
        background: var(--kanban-bg);
        border: 1px solid #dbe6de;
        border-radius: 19px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 200px);
        scroll-snap-align: start;
        margin: 0;
        background: rgba(247,250,248,.96);
        box-shadow: 0 10px 30px rgba(27,52,34,.08);
        overflow: hidden;
    }

    .kanban-column-header {
        min-height: 53px;
        padding: 12px 15px;
        border-radius: 16px 16px 0 0;
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        box-shadow: inset 0 -1px rgba(255,255,255,.24);
    }

    .kanban-column-body {
        padding: 11px;
        overflow-y: auto;
        flex: 1;
    }

    .kanban-card {
        background: white;
        border: 1px solid #e1e9e3;
        border-left-width: 5px;
        border-radius: 15px;
        padding: 13px;
        margin-bottom: 10px;
        box-shadow: 0 4px 14px rgba(20,50,29,.075);
        cursor: grab;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }
    .kanban-card:before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, rgba(47,143,78,.1), rgba(47,143,78,.6), rgba(47,143,78,.1));
    }
    .kanban-card:hover {
        box-shadow: 0 12px 27px rgba(20,50,29,.15);
        transform: translateY(-3px);
    }
    .kanban-card:active { cursor: grabbing; opacity: 0.8; }
    .kanban-card.dragging {
        opacity: 0.5;
        transform: rotate(2deg) scale(0.95);
    }
    .kanban-card.drag-over {
        border: 2px dashed var(--verde);
        background: #f0fdf4;
    }

    .kanban-card.prioridade-URGENTE { border-left-color: #dc3545; }
    .kanban-card.prioridade-ALTA { border-left-color: #fd7e14; }
    .kanban-card.prioridade-MEDIA { border-left-color: #ffc107; }
    .kanban-card.prioridade-BAIXA { border-left-color: #6c757d; }

    .card-prioridade-badge {
        position: absolute;
        top: 9px; right: 9px;
        font-size: .52rem;
        padding: 3px 7px;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .card-status-badge {
        font-size: .56rem;
        padding: 4px 8px;
        border-radius: 8px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 4px;
    }

    .card-progress {
        height: 6px;
        background: #e9ecef;
        border-radius: 2px;
        margin: 8px 0;
        overflow: hidden;
    }
    .card-progress-bar {
        height: 100%;
        border-radius: 2px;
        transition: width 0.5s ease;
    }

    .card-actions {
        display: flex;
        gap: 4px;
        margin-top: 6px;
        flex-wrap: wrap;
        padding-top: 8px;
        border-top: 1px solid #edf1ee;
    }
    .card-actions .btn {
        font-size: 0.6rem;
        padding: 3px 8px;
        border-radius: 8px;
        min-width: 32px;
    }

    .coluna-drop-zone {
        min-height: 60px;
        border: 2px dashed transparent;
        border-radius: 8px;
        transition: all 0.3s;
    }
    .coluna-drop-zone.active {
        border-color: var(--verde);
        background: rgba(47, 143, 78, 0.05);
    }

    .empty-column {
        text-align: center;
        color: #94a3b8;
        padding: 20px 10px;
        font-size: 0.75rem;
    }

    /* ===== TOPO UNIFICADO ===== */
    body { background: #f5f8f6; }
    .kanban-page-shell {
        padding: 14px;
        min-height: calc(100vh - 70px);
        background:
            radial-gradient(circle at 8% 0%, rgba(47,143,78,.13), transparent 30%),
            linear-gradient(180deg,#f8fbf9,#eef4f0);
    }

    .kanban-premium-header {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 16px;
        align-items: center;
        padding: 18px 20px;
        margin-bottom: 14px;
        border-radius: 22px;
        color: #fff;
        background: linear-gradient(135deg,#153e26,#2f8f4e 68%,#55ad6e);
        box-shadow: 0 16px 38px rgba(26,91,50,.22);
        position: relative;
        overflow: visible;
    }
    .kanban-premium-header:after {
        content: "";
        position: absolute;
        width: 230px;
        height: 230px;
        right: -80px;
        top: -125px;
        border-radius: 50%;
        background: rgba(255,255,255,.09);
        pointer-events: none;
    }

    .kanban-premium-title h5 {
        font-size: 1.18rem;
        font-weight: 900;
        margin: 0;
    }
    .kanban-premium-title small {
        color: rgba(255,255,255,.78);
    }

    .kanban-search-box {
        position: relative;
        z-index: 5;
        min-width: 280px;
    }
    .kanban-search-box input {
        width: 100%;
        min-height: 46px;
        padding: 0 44px 0 43px;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 14px;
        background: rgba(255,255,255,.96);
        outline: none;
        box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }
    .kanban-search-box input:focus {
        box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 10px 25px rgba(0,0,0,.16);
    }
    .kanban-search-box .fa-search {
        position: absolute;
        left: 15px;
        top: 15px;
        color: #2f8f4e;
    }
    .kanban-search-results {
        position: absolute;
        top: 53px;
        left: 0;
        right: 0;
        z-index: 3000;
        display: none;
        max-height: 360px;
        overflow: auto;
        border-radius: 15px;
        padding: 7px;
        background: #fff;
        color: #17231b;
        box-shadow: 0 20px 55px rgba(0,0,0,.25);
        border: 1px solid #dce7df;
        max-width: 100%;
        box-sizing: border-box;
    }
    .kanban-result-item {
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .kanban-result-item:hover {
        background: #eff8f2;
        border-color: #cce3d3;
    }
    .kanban-result-item strong {
        display: block;
        font-size: .78rem;
    }
    .kanban-result-item small {
        color: #748078;
    }

    .kanban-header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .kanban-header-actions .btn {
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 10px;
        white-space: nowrap;
    }

    .card-details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin: 8px 0;
        font-size: .62rem;
        color: #66766c;
    }
    .card-details-grid > span {
        padding: 5px 6px;
        border-radius: 8px;
        background: #f6f9f7;
        border: 1px solid #ebf0ed;
    }
    .card-destination {
        margin-top: 7px;
        padding: 7px 8px;
        border-radius: 9px;
        color: #175a31;
        background: #ebf8ef;
        border: 1px solid #cfe8d7;
        font-size: .64rem;
        font-weight: 750;
    }
    .card-tags-premium {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
    }
    .card-tag-premium {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 7px;
        border-radius: 999px;
        font-size: .54rem;
        font-weight: 850;
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .kanban-card.search-highlight {
        animation: kbPulse 1.7s ease;
        box-shadow: 0 0 0 5px rgba(255,193,7,.28), 0 14px 28px rgba(0,0,0,.16);
    }
    @keyframes kbPulse {
        0%,100% { transform: scale(1); }
        45% { transform: scale(1.035); }
    }

    .btn-card-tag {
        color: #7c3aed;
        border-color: #c4b5fd;
        background: #faf8ff;
    }
    .btn-card-tag:hover {
        color: #fff;
        border-color: #7c3aed;
        background: #7c3aed;
    }
    .tag-selector-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
    }
    .tag-selector-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 11px;
        border-radius: 999px;
        border: 3px solid transparent;
        cursor: pointer;
        font-size: .7rem;
        font-weight: 800;
        opacity: .55;
        transition: .18s ease;
        user-select: none;
    }
    .tag-selector-item:hover {
        opacity: .85;
        transform: translateY(-1px);
    }
    .tag-selector-item.selected {
        opacity: 1;
        border-color: #17231b;
        box-shadow: 0 5px 13px rgba(0,0,0,.16);
        transform: translateY(-1px);
    }
    .tag-empty-state {
        width: 100%;
        padding: 18px;
        text-align: center;
        color: #76837b;
        border: 1px dashed #cedbd2;
        border-radius: 12px;
        background: #f8fbf9;
    }

    /* ===== MEDIA QUERIES ===== */
    @media (min-width: 1200px) {
        .kanban-wrapper {
            padding-left: 24px;
            padding-right: 24px;
            scroll-padding-left: 24px;
        }
        .kanban-column {
            min-width: 320px;
            max-width: 380px;
        }
    }

    @media (min-width: 769px) and (max-width: 1199px) {
        .kanban-wrapper {
            gap: 14px;
            padding-left: 14px;
            padding-right: 14px;
            scroll-padding-left: 14px;
        }
        .kanban-column {
            min-width: 280px;
            max-width: 320px;
        }
        .kanban-card { padding: 11px; }
        .card-actions .btn {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
    }

    @media (max-width: 768px) {
        .kanban-scrollbar-top { display: none; }
        .kanban-wrapper {
            gap: 12px;
            padding: 12px 6px 24px 12px;
            scroll-padding-left: 12px;
        }
        .kanban-column {
            min-width: 260px;
            max-width: 300px;
        }
        .kanban-card { padding: 10px; }
        .card-actions .btn {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
        .kanban-page-shell { padding: 7px 4px 18px; }
        .kanban-premium-header {
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .kanban-header-actions {
            justify-content: flex-start;
        }
        .card-details-grid { grid-template-columns: 1fr; }
    }

    table {
    width: 100%;
    border-collapse: collapse;
    /* remova table-layout: fixed; */
    font-size: 8px;
}
/* em vez de larguras fixas, use min-width para cada coluna */
.c-num { min-width: 28px; text-align: center; }
.c-status { min-width: 80px; }
.c-lote { min-width: 108px; }
.c-qtd { min-width: 54px; text-align: center; }
.c-produto { min-width: 155px; }
.c-cultivar { min-width: 130px; }
.c-peneira { min-width: 58px; text-align: center; }
.c-armazem { min-width: 90px; }
.c-endereco { min-width: 122px; }
.c-cliente { min-width: 125px; }

    /* ===== CORREÇÕES DE ESTABILIDADE E ACABAMENTO ===== */
    html, body {
        max-width: 100%;
        overflow-x: hidden;
    }

    .kanban-page-shell {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
    }

    .kanban-wrapper {
        width: 100%;
        max-width: 100%;
        overscroll-behavior-x: contain;
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
    }

    .kanban-scrollbar-top {
        overscroll-behavior-x: contain;
        scrollbar-gutter: stable;
    }

    .kanban-card.search-highlight {
        animation: kbSearchGlow 1.55s ease;
        box-shadow:
            0 0 0 4px rgba(255, 193, 7, .30),
            0 16px 32px rgba(20, 50, 29, .18);
    }

    @keyframes kbSearchGlow {
        0%, 100% { transform: translateY(0) scale(1); }
        45% { transform: translateY(-2px) scale(1.018); }
    }

    .report-destino {
        border-left: 5px solid #2f8f4e !important;
        background: linear-gradient(135deg, #ecf8f0, #ffffff) !important;
    }

    .report-observacao {
        border-left: 5px solid #f59e0b !important;
        background: linear-gradient(135deg, #fff8e8, #ffffff) !important;
    }


/* ---------- PREVIEW DE IMPRESSÃO MOBILE ---------- */
#mobilePrintPreview {
    position: fixed;
    inset: 0;
    z-index: 2147482000;
    display: none;
    flex-direction: column;
    background: #eef3ef;
}

#mobilePrintPreview.show {
    display: flex !important;
}

#mobilePrintPreviewBar {
    flex: 0 0 auto;
    min-height: 48px;
    padding:
        calc(6px + env(safe-area-inset-top))
        8px
        6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: #fff;
    background: linear-gradient(135deg,#174d2c,#2f8f4e);
    box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

#mobilePrintPreviewBar strong {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: .82rem;
}

#mobilePrintPreview iframe {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    border: 0;
    background: #eef3ef;
}

/* ===== SWIMLANES KANBAN ===== */
.kanban-swimlanes { display:flex; flex-direction:column; gap:14px; }
.kanban-lane { border:1px solid #dbe6de; border-radius:18px; background:#fff; box-shadow:0 8px 24px rgba(27,52,34,.07); overflow:hidden; }
.kanban-lane-header { width:100%; border:0; display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 16px; font-weight:900; letter-spacing:.04em; color:#173f27; background:linear-gradient(180deg,#f8fbf9,#edf5f0); cursor:pointer; position:relative; }
.kanban-lane-header .lane-count { position:absolute; right:16px; padding:3px 9px; border-radius:999px; background:#fff; border:1px solid #d5e4d9; font-size:.68rem; }
.kanban-lane-header .lane-chevron { position:absolute; left:16px; transition:transform .18s ease; }
.kanban-lane.collapsed .lane-chevron { transform:rotate(-90deg); }
.kanban-lane-body { padding:9px 0 0; }
.kanban-lane.collapsed .kanban-lane-body { display:none; }
.kanban-lane-carga .kanban-lane-header { color:#7a2d22; background:linear-gradient(180deg,#fff9f6,#fff0eb); }
.kanban-lane .kanban-wrapper { min-height:360px; max-height:none; padding-left:12px; }
.kanban-lane .kanban-column { max-height:610px; }
.kanban-lane .kanban-scrollbar-top { margin:0 12px 7px; width:calc(100% - 24px); }
@media(max-width:768px){ .kanban-lane-header{padding:12px 44px;font-size:.82rem}.kanban-lane .kanban-wrapper{min-height:330px;padding-left:8px}.kanban-lane .kanban-scrollbar-top{display:none}.kanban-lane-header .lane-count{right:10px}.kanban-lane-header .lane-chevron{left:10px} }

</style>

<div class="kanban-page-shell">
    <!-- TOPO UNIFICADO -->
    <div class="kanban-premium-header">
        <div class="kanban-premium-title">
            <h5><i class="fas fa-layer-group me-2"></i>Kanban</h5>
            <small>A movimentação dos cards entre colunas é automática</small>
        </div>
        <div class="kanban-search-box">
            <i class="fas fa-search"></i>
            <input id="kanbanSearchInput" type="search" placeholder="Pesquisar lote, título, destino..." autocomplete="off">
            <div id="kanbanSearchResults" class="kanban-search-results"></div>
        </div>
        <div class="kanban-header-actions">
            <a href="{% url 'sapp:pagina_solicitacoes' %}" class="btn btn-light btn-sm">
                <i class="fas fa-list me-1"></i> Lista
            </a>
            <a href="{% url 'sapp:pagina_config_workflow' %}" class="btn btn-light btn-sm">
                <i class="fas fa-cog me-1"></i> Configurar
            </a>
            <button class="btn btn-light btn-sm" onclick="recarregarKanban()">
                <i class="fas fa-sync-alt me-1"></i> Atualizar
            </button>
        </div>
    </div>

    <!-- KANBAN EM DUAS LINHAS / SWIMLANES -->
    <div class="kanban-swimlanes" id="kanbanBoard">
        <div class="text-center py-5 w-100">
            <div class="spinner-border text-success mb-3" role="status"></div>
            <h5 class="text-muted">Carregando Kanban...</h5>
        </div>
    </div>
</div>

<!-- MODAL MOVER CARD -->
<div class="modal fade" id="modalMoverCard" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h6 class="modal-title"><i class="fas fa-arrows-alt me-2"></i>Mover Card</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

                <p class="small text-muted mb-2">Selecione a coluna de destino:</p>
                <div class="list-group" id="listaColunasDestino"></div>
                <div class="mt-3">
                    <label class="form-label small">Observação (opcional)</label>
                    <textarea id="obsMoverCard" class="form-control form-control-sm" rows="2" placeholder="Motivo da movimentação..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-primary" id="btnConfirmarMover" onclick="confirmarMoverCard()">
                    <i class="fas fa-check me-1"></i> Mover
                </button>
            </div>
        </div>
    </div>
</div>

<audio id="audioNotificacao" preload="auto" style="display:none;" src=""></audio>

<!-- MODAL TAGS -->
<div class="modal fade" id="modalTagsKanban" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0" style="border-radius:18px;overflow:hidden;">
            <div class="modal-header text-white" style="background:linear-gradient(135deg,#4c1d95,#7c3aed);">
                <div>
                    <h6 class="modal-title mb-0"><i class="fas fa-tags me-2"></i>Tags do card</h6>
                    <small id="tagCardTitulo" style="opacity:.82;"></small>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="tagSelectorGrid" class="tag-selector-grid"></div>
                <hr>
                <div class="small fw-bold text-muted mb-2"><i class="fas fa-plus-circle me-1"></i>Criar nova tag</div>
                <div class="row g-2">
                    <div class="col-sm-5"><input id="novaTagNomeKanban" type="text" class="form-control form-control-sm" maxlength="50" placeholder="Ex.: Impresso"></div>
                    <div class="col-sm-5"><input id="novaTagIconeKanban" type="text" class="form-control form-control-sm" maxlength="50" placeholder="fas fa-print"></div>
                    <div class="col-sm-2"><input id="novaTagCorKanban" type="color" class="form-control form-control-color w-100" value="#2f8f4e" title="Cor da tag"></div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-success mt-2" onclick="criarTagKanban()">
                    <i class="fas fa-plus me-1"></i>Criar e selecionar
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success btn-sm px-3" onclick="salvarTagsKanban()">
                    <i class="fas fa-save me-1"></i>Salvar tags
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== IMPRESSÃO MOBILE ==================== -->
<div id="mobilePrintPreview">
    <div id="mobilePrintPreviewBar">
        <strong>
            <i class="fas fa-print me-1"></i>
            Visualização da solicitação
        </strong>

        <button
            type="button"
            class="btn btn-light btn-sm"
            onclick="fecharImpressaoMobile()"
        >
            <i class="fas fa-times me-1"></i>
            Fechar
        </button>
    </div>

    <iframe
        id="mobilePrintFrame"
        title="Visualização da impressão"
    ></iframe>
</div>


<script>
// ===== FUNÇÕES UTILITÁRIAS =====
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function mostrarToast(mensagem) {
    const container = document.getElementById('toastContainer') || (() => {
        const div = document.createElement('div');
        div.id = 'toastContainer';
        div.className = 'toast-container position-fixed bottom-0 end-0 p-3';
        document.body.appendChild(div);
        return div;
    })();
    const toastId = 'toast-' + Date.now();
    const html = `
        <div id="${toastId}" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">${mensagem}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
}

let cardArrastado = null;
let colunaOrigem = null;
let cardParaMover = null;

document.addEventListener('DOMContentLoaded', carregarKanban);

async function carregarKanban() {
    try {

function renderizarColunasLane(colunas, tipo) {
    return colunas.map(coluna => {
        const cards = (coluna.cards || []).filter(card => {
            const isCarga = String(card.tipo_solicitacao || '').toUpperCase() === 'CARGA';
            return tipo === 'CARGA' ? isCarga : !isCarga;
        });
        return `
            <div class="kanban-column" data-coluna-id="${coluna.id}" data-coluna-nome="${escaparHtmlKanban(coluna.nome)}">
                <div class="kanban-column-header" style="background:${coluna.cor};">
                    <span><i class="fas fa-circle me-2" style="font-size:.5rem;"></i>${escaparHtmlKanban(coluna.nome)}</span>
                    <span class="badge bg-light text-dark">${cards.length}</span>
                </div>
                <div class="kanban-column-body coluna-drop-zone"
                     data-coluna-id="${coluna.id}"
                     ondragover="handleDragOver(event)"
                     ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event)">
                    ${cards.length
                        ? cards.map(card => criarCardHTML(card)).join('')
                        : '<div class="empty-column"><i class="fas fa-inbox fa-2x d-block mb-2 opacity-50"></i>Vazio</div>'}
                </div>
            </div>`;

function estadoLaneSalvo(chave) {
    const salvo = localStorage.getItem(`kanbanLane:${chave}`);
    // Primeira visita: mostra somente as duas faixas, no estilo swimlane.
    // O usuário clica em TSI ou EXPEDIÇÃO/CARREGAMENTO para expandir.
    return salvo !== 'open';

function criarCardHTML(card) {
    const prioridadeClass =
        `prioridade-${card.prioridade}`;

    const qtdEmp =
        card.quantidade_empenhada_display
        ?? card.quantidade_empenhada
        ?? 0;

    const embalagens = [
        ...new Set(
            (card.embalagens || [])
                .map(v =>
                    String(v || '')
                        .trim()
                        .toUpperCase()
                )
                .filter(Boolean)
        )
    ];

    embalagens.sort((a, b) => {
        const ordem = {
            BAG: 1,
            SC: 2
        };

        return (
            (ordem[a] ?? 99)
            - (ordem[b] ?? 99)
        );
    });

    const unidade = (
        card.unidade_controle === 'QUILOGRAMA'
            ? 'KG'
            : (
                embalagens.length
                    ? embalagens.join('/')
                    : 'BAGS/SC'
            )
    );

    const qtdFormatada = (
        card.unidade_controle === 'QUILOGRAMA'
            ? Number(qtdEmp).toFixed(2)
            : Math.round(qtdEmp)
    );

    const percentual =
        card.percentual_empenhado ??
        (
            card.quantidade_solicitada > 0
                ? (
                    card.quantidade_empenhada
                    / card.quantidade_solicitada
                ) * 100
                : 0
        );
    
    const statusColors = {
        'AGUARDANDO_EMPENHO': '#fff3cd',
        'EMPENHO_PARCIAL': '#cce5ff',
        'EMPENHO_COMPLETO': '#d4edda',
        'MOVIMENTACAO_PARCIAL': '#d1ecf1',
        'CONCLUIDO': '#d4edda',
        'CANCELADO': '#f8d7da',
    };
    const prioridadeBadgeColor = {
        'URGENTE': 'danger',
        'ALTA': 'warning',
        'MEDIA': 'secondary',
        'BAIXA': 'secondary'
    };
    return `
        <div class="kanban-card ${prioridadeClass}" 
             draggable="true" 
             data-card-id="${card.id}"
             data-card-titulo="${card.titulo}"
             data-card-tipo="${card.tipo_solicitacao || 'TRANSFERENCIA'}">
            <span class="card-prioridade-badge bg-${prioridadeBadgeColor[card.prioridade] || 'secondary'} text-${card.prioridade === 'ALTA' ? 'dark' : 'white'}">
                ${card.prioridade}
            </span>
            <h6 class="mb-1 pe-4" style="font-size:0.8rem;">${card.titulo}</h6>
            <span class="card-status-badge" style="background: ${statusColors[card.status] || '#f8f9fa'};">
                <strong>Situação:</strong> ${card.status_display || card.status}
            </span>
            <span class="badge ${card.tipo_solicitacao === 'CARGA' ? 'bg-danger' : 'bg-primary'} mt-1" style="font-size:.62rem;">
                <i class="fas ${card.tipo_solicitacao === 'CARGA' ? 'fa-truck' : 'fa-right-left'} me-1"></i>${card.tipo_solicitacao_display || (card.tipo_solicitacao === 'CARGA' ? 'Carga' : 'Transferência')}
            </span>
            <div class="card-progress">
                <div class="card-progress-bar ${percentual >= 100 ? 'bg-success' : percentual >= 50 ? 'bg-warning' : 'bg-danger'}" 
                     style="width: ${percentual}%"></div>
            </div>
            <div class="card-details-grid">
                <span><i class="fas fa-box me-1"></i>${Number(card.quantidade_solicitada || 0) > 0 ? `${qtdFormatada}/${card.quantidade_solicitada} ${unidade}` : `${qtdFormatada} ${unidade} · ABERTA`}</span>
                <span><i class="fas fa-user me-1"></i>${card.criador_nome || '-'}</span>
                <span><i class="far fa-clock me-1"></i>${card.data_criacao || '-'}</span>
                ${card.data_finalizacao ? `<span><i class="fas fa-check-circle me-1 text-success"></i>${card.data_finalizacao}</span>` : ''}
                
                ${card.criterios?.cliente ? `<span><i class="fas fa-building me-1"></i>${card.criterios.cliente}</span>` : ''}
            </div>
            ${card.destino || card.criterios?.destino ? `<div class="card-destination"><i class="fas fa-location-arrow me-1"></i>Destino: ${card.destino || card.criterios.destino}</div>` : ''}
            <div class="card-tags-premium">
                ${(card.tags || []).map(tag => `<span class="card-tag-premium" style="background:${tag.cor || '#2f8f4e'};color:${tag.cor_texto || '#fff'}">${tag.icone ? `<i class="${tag.icone}"></i>` : ''}${tag.nome}</span>`).join('')}
            </div>
            <div class="card-actions">
                
                <button class="btn btn-sm btn-outline-secondary"
                        onclick="event.stopPropagation(); abrirModalMover(${card.id}, '${card.titulo.replace(/'/g, "\\'")}')"
                        title="Mover card">
                    <i class="fas fa-arrows-alt"></i>
                </button>
                <button class="btn btn-sm btn-card-tag"
                        onclick="event.stopPropagation(); abrirTagsKanban(${card.id})"
                        title="Trocar tags">
                    <i class="fas fa-tags"></i>
                </button>
                <button class="btn btn-sm btn-outline-info"
                        onclick="event.stopPropagation(); imprimirCardKanban(${card.id})"

                    <i class="fas fa-print"></i>

// ===== DRAG & DROP =====
function handleDragStart(e) {
    cardArrastado = this;
    colunaOrigem = this.closest('.kanban-column').dataset.colunaId;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.cardId);
}
function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.coluna-drop-zone.active').forEach(zone => zone.classList.remove('active'));
    cardArrastado = null;
    colunaOrigem = null;
}
function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('active');
}
function handleDragLeave(e) {
    this.classList.remove('active');
}
async function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('active');
    const cardId = e.dataTransfer.getData('text/plain');
    const colunaDestinoId = this.dataset.colunaId;
    const laneDestino = this.closest('.kanban-lane')?.dataset.lane || '';
    const tipoCard = String(cardArrastado?.dataset.cardTipo || '').toUpperCase();
    const laneCorreta = tipoCard === 'CARGA' ? 'carga' : 'tsi';
    if (laneDestino && laneDestino !== laneCorreta) {
        mostrarToast(tipoCard === 'CARGA'
            ? 'Cargas permanecem na faixa EXPEDIÇÃO / CARREGAMENTO.'
            : 'TSI permanece na faixa TSI.');
        return;
    }
    if (colunaDestinoId === colunaOrigem) return;
    if (cardArrastado) this.appendChild(cardArrastado);
    await moverCardAPI(cardId, colunaDestinoId);
    setTimeout(recarregarKanban, 500);
}

// ===== MODAL MOVER =====
function abrirModalMover(cardId, cardTitulo) {
    cardParaMover = cardId;
    const lista = document.getElementById('listaColunasDestino');
    lista.innerHTML = '';
    if (!kanbanData || !kanbanData.colunas_disponiveis) {
        lista.innerHTML = '<div class="text-muted small p-2">Carregando...</div>';
        return;
    }
    kanbanData.colunas_disponiveis.forEach(coluna => {
        const item = document.createElement('div');
        item.className = 'list-group-item list-group-item-action d-flex align-items-center gap-2';
        item.innerHTML = `
            <span style="width: 12px; height: 12px; border-radius: 50%; background: ${coluna.cor}; flex-shrink: 0;"></span>
            <span>${coluna.nome}</span>
        `;
        item.onclick = () => {
            document.querySelectorAll('#listaColunasDestino .active').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            item.dataset.colunaId = coluna.id;
        };
        lista.appendChild(item);
    });
    document.getElementById('obsMoverCard').value = '';
    new bootstrap.Modal(document.getElementById('modalMoverCard')).show();

async function confirmarMoverCard() {
    const itemAtivo = document.querySelector('#listaColunasDestino .active');
    if (!itemAtivo) { alert('Selecione uma coluna de destino'); return; }
    const colunaDestinoId = itemAtivo.dataset.colunaId;
    const observacao = document.getElementById('obsMoverCard').value;
    await moverCardAPI(cardParaMover, colunaDestinoId, observacao);
    bootstrap.Modal.getInstance(document.getElementById('modalMoverCard')).hide();

}

// ===== API =====
async function moverCardAPI(cardId, colunaDestinoId, observacao = '') {
    try {
        const resp = await fetch(`/api/solicitacoes/${cardId}/mover-kanban/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ coluna_id: colunaDestinoId, observacao })
        });
        const data = await resp.json();
        if (data.success) mostrarToast(`✅ Card movido para "${data.coluna_nova}"`);
        else alert('❌ ' + (data.error || 'Erro ao mover card'));
    } catch (e) {
        console.error('Erro ao mover card:', e);
        alert('Erro ao mover card');
    }
}
function recarregarKanban() { carregarKanban(); }

// ===== BARRA DE ROLAGEM SUPERIOR POR LINHA =====
function configurarScrollbarSuperior() {
    document.querySelectorAll('.kanban-lane:not(.collapsed)').forEach(lane => {
        const wrapper = lane.querySelector('.kanban-wrapper');
        const scrollTop = lane.querySelector('.kanban-scrollbar-top');
        const scrollContent = lane.querySelector('.kanban-scrollbar-content');
        if (!wrapper || !scrollTop || !scrollContent) return;

        const atualizar = () => {
            const largura = Math.max(wrapper.scrollWidth, wrapper.clientWidth);
            scrollContent.style.width = `${largura}px`;
            scrollTop.classList.toggle('visible', wrapper.scrollWidth > wrapper.clientWidth + 2);
            if (!scrollTop.dataset.syncing) scrollTop.scrollLeft = wrapper.scrollLeft;
        };

        if (!wrapper.dataset.topScrollBound) {
            wrapper.dataset.topScrollBound = '1';
            scrollTop.addEventListener('scroll', () => {
                scrollTop.dataset.syncing = '1';
                wrapper.scrollLeft = scrollTop.scrollLeft;
                requestAnimationFrame(() => delete scrollTop.dataset.syncing);
            }, {passive:true});
            wrapper.addEventListener('scroll', () => {
                if (scrollTop.dataset.syncing) return;
                scrollTop.scrollLeft = wrapper.scrollLeft;
            }, {passive:true});
        }
        atualizar();
    });
}
window.addEventListener('resize', configurarScrollbarSuperior, {passive:true});

// ===== PESQUISA =====
let kanbanSearchTimer = null;
document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('kanbanSearchInput');
    if (!input) return;
    input.addEventListener('input', () => {
        clearTimeout(kanbanSearchTimer);
        kanbanSearchTimer = setTimeout(() => pesquisarNoKanban(input.value), 280);
    });
    document.addEventListener('click', event => {
        if (!event.target.closest('.kanban-search-box')) {
            const box = document.getElementById('kanbanSearchResults');
            if (box) box.style.display = 'none';
        }
    });
});

async function pesquisarNoKanban(termo) {
    const box = document.getElementById('kanbanSearchResults');
    termo = String(termo || '').trim();
    if (termo.length < 2) { box.style.display = 'none'; box.innerHTML = ''; return; }
    try {
        const resposta = await fetch(`/api/kanban/pesquisar/?q=${encodeURIComponent(termo)}`);
        const dados = await resposta.json();
        const resultados = dados.resultados || [];
        box.innerHTML = resultados.length ? resultados.map(item => `
            <div class="kanban-result-item" onclick="localizarCardKanban(${item.id})">
                <strong>#${item.id} · ${escaparHtmlKanban(item.titulo)}</strong>
                <small>${escaparHtmlKanban(item.coluna_nome || 'Sem coluna')} ${item.lotes?.length ? `· Lote(s): ${item.lotes.map(escaparHtmlKanban).join(', ')}` : ''} ${item.destino ? `· Destino: ${escaparHtmlKanban(item.destino)}` : ''}</small>
            </div>`).join('') : '<div class="p-3 small text-muted">Nenhum card encontrado.</div>';
        box.style.display = 'block';
    } catch (erro) {
        console.error(erro);
        box.innerHTML = '<div class="p-3 small text-danger">Erro ao pesquisar.</div>';
        box.style.display = 'block';
    }
}
function escaparHtmlKanban(valor) {
    const div = document.createElement('div');
    div.textContent = valor ?? '';
    return div.innerHTML;
}
function localizarCardKanban(id) {
    const resultados = document.getElementById(
        'kanbanSearchResults'
    );

    if (resultados) {
        resultados.style.display = 'none';
    }

    const card = document.querySelector(
        `[data-card-id="${id}"]`
    );

    if (!card) return;

    const lane = card.closest('.kanban-lane');
    if (lane?.classList.contains('collapsed')) {
        lane.classList.remove('collapsed');
        localStorage.setItem(`kanbanLane:${lane.dataset.lane}`, 'open');
    }

    const wrapper = card.closest('.kanban-wrapper');
    const coluna = card.closest(
        '.kanban-column'
    );

    if (!wrapper || !coluna) return;

    if (!coluna) return;

    /*
     * Não usamos scrollIntoView().
     * Ele pode deslocar o BODY inteiro.
     * Movemos somente o scroll interno do Kanban.
     */
    const colunaLeft = coluna.offsetLeft;
    const colunaWidth = coluna.offsetWidth;
    const viewportWidth = wrapper.clientWidth;

    const destinoHorizontal = Math.max(
        0,
        colunaLeft
        - ((viewportWidth - colunaWidth) / 2)
    );

    wrapper.scrollTo({
        left: destinoHorizontal,
        behavior: 'smooth'
    });

    const corpoColuna = card.closest(
        '.kanban-column-body'
    );

    if (corpoColuna) {
        const destinoVertical = Math.max(
            0,
            card.offsetTop
            - (corpoColuna.clientHeight / 2)
            + (card.offsetHeight / 2)
        );

        corpoColuna.scrollTo({
            top: destinoVertical,
            behavior: 'smooth'
        });
    }

    card.classList.remove(
        'search-highlight'
    );

    void card.offsetWidth;

    card.classList.add(
        'search-highlight'
    );

    setTimeout(
        () => card.classList.remove(
            'search-highlight'
        ),
        1700
    );
}

// ===== TAGS =====
let cardTagsKanbanId = null;
let tagsSelecionadasKanban = new Set();

function getCookieKanban(nome) { return getCookie(nome); }

function todosCardsKanban() {
    if (!kanbanData?.colunas) return [];
    return kanbanData.colunas.flatMap(coluna => coluna.cards || []);
}

function abrirTagsKanban(cardId) {
    const card = todosCardsKanban().find(item => Number(item.id) === Number(cardId));
    if (!card) { alert('Card não encontrado.'); return; }
    cardTagsKanbanId = Number(cardId);
    tagsSelecionadasKanban = new Set((card.tags || []).map(tag => Number(tag.id)));
    document.getElementById('tagCardTitulo').textContent = `Card #${card.id} · ${card.titulo}`;
    renderizarTagsKanban();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTagsKanban')).show();
}

function renderizarTagsKanban() {
    const grid = document.getElementById('tagSelectorGrid');
    if (!grid) return;
    const tags = kanbanData?.tags_disponiveis || [];
    if (!tags.length) {
        grid.innerHTML = `<div class="tag-empty-state"><i class="fas fa-tags d-block mb-2"></i>Nenhuma tag cadastrada. Crie a primeira abaixo.</div>`;
        return;
    }
    grid.innerHTML = tags.map(tag => {
        const selecionada = tagsSelecionadasKanban.has(Number(tag.id));
        return `<span class="tag-selector-item ${selecionada ? 'selected' : ''}" style="background:${escaparHtmlKanban(tag.cor || '#2f8f4e')};color:${escaparHtmlKanban(tag.cor_texto || '#ffffff')};" onclick="alternarTagKanban(${Number(tag.id)})" title="Clique para ${selecionada ? 'remover' : 'adicionar'}">${tag.icone ? `<i class="${escaparHtmlKanban(tag.icone)}"></i>` : ''}${escaparHtmlKanban(tag.nome)}</span>`;
    }).join('');
}

function alternarTagKanban(tagId) {
    tagId = Number(tagId);
    tagsSelecionadasKanban.has(tagId) ? tagsSelecionadasKanban.delete(tagId) : tagsSelecionadasKanban.add(tagId);
    renderizarTagsKanban();
}

async function salvarTagsKanban() {
    if (!cardTagsKanbanId) return;
    try {
        const resposta = await fetch(`/api/solicitacoes/${cardTagsKanbanId}/tags/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ tags_ids: [...tagsSelecionadasKanban] }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok || !dados.success) throw new Error(dados.error || 'Não foi possível salvar as tags.');
        bootstrap.Modal.getInstance(document.getElementById('modalTagsKanban'))?.hide();
        await recarregarKanban();
    } catch (erro) { alert(`❌ ${erro.message}`); }
}

async function criarTagKanban() {
    const nomeInput = document.getElementById('novaTagNomeKanban');
    const iconeInput = document.getElementById('novaTagIconeKanban');
    const corInput = document.getElementById('novaTagCorKanban');
    const nome = nomeInput.value.trim();
    const icone = iconeInput.value.trim();
    const cor = corInput.value;
    if (!nome) { alert('Digite o texto da tag.'); nomeInput.focus(); return; }
    try {
        const resposta = await fetch('/api/kanban/tags/criar/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ nome, icone, cor }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok || !dados.success) throw new Error(dados.error || 'Não foi possível criar a tag.');
        if (!Array.isArray(kanbanData.tags_disponiveis)) kanbanData.tags_disponiveis = [];
        const indice = kanbanData.tags_disponiveis.findIndex(tag => Number(tag.id) === Number(dados.tag.id));
        if (indice >= 0) kanbanData.tags_disponiveis[indice] = dados.tag;
        else kanbanData.tags_disponiveis.push(dados.tag);
        tagsSelecionadasKanban.add(Number(dados.tag.id));
        nomeInput.value = ''; iconeInput.value = ''; corInput.value = '#2f8f4e';
        renderizarTagsKanban();
    } catch (erro) { alert(`❌ ${erro.message}`); }
}

function fecharImpressaoMobile() {
    const preview = document.getElementById(
        'mobilePrintPreview'
    );

    const frame = document.getElementById(
        'mobilePrintFrame'
    );

    if (preview) {
        preview.classList.remove(
            'show'
        );
    }

    if (frame) {
        frame.src = 'about:blank';
    }

    document.body.style.overflow = '';
}

function abrirJanelaImpressaoMobile() {
    const preview = document.getElementById(
        'mobilePrintPreview'
    );

    const frame = document.getElementById(
        'mobilePrintFrame'
    );

    if (!preview || !frame) {
        return null;
    }

    preview.classList.add(
        'show'
    );

    document.body.style.overflow = 'hidden';

    /*
     * about:blank mantém o mesmo origin,
     * permitindo document.write e window.print.
     */
    frame.src = 'about:blank';

    return frame.contentWindow;
}


// ===== IMPRESSÃO CORRIGIDA (SEM ARMazém NO TOPO, MAIS LIMPA) =====
function gerarImpressaoSolicitacao(id, janelaExistente = null) {
    const isMobilePrint = (
        window.matchMedia(
            '(max-width: 900px)'
        ).matches
        || (
            'ontouchstart' in window
            && window.innerWidth <= 1100
        )
    );

    let win = janelaExistente || null;

    /*
     * Quando o usuário troca o relatório pelo seletor da própria
     * visualização, reutilizamos a mesma janela/iframe.
     */
    if (!win) {
        if (isMobilePrint) {
            win = abrirJanelaImpressaoMobile();
        } else {
            win = window.open(
                '',
                '_blank',
                'width=1350,height=900'
            );
        }
    }

    /*
     * Se o navegador desktop bloquear popup,
     * usa o mesmo fallback mobile.
     */
    if (!win) {
        win = abrirJanelaImpressaoMobile();
    }

    if (!win) {
        alert(
            'Não foi possível abrir a visualização da impressão.'
        );
        return;
    }

    win.document.write(`
        <!doctype html>
        <html lang="pt-BR">
        <head><meta charset="utf-8"><title>Carregando...</title></head>
        <body style="font-family:Arial;text-align:center;padding:60px;color:#1f5d35;">
            <div style="width:42px;height:42px;margin:0 auto 14px;border:5px solid #dcece2;border-top-color:#2f8f4e;border-radius:50%;animation:girar .8s linear infinite;"></div>
            <h3 style="margin:0">Preparando relatório...</h3>
            <style>@keyframes girar{to{transform:rotate(360deg)}}</style>
        </body></html>
    `);

    fetch(`/api/solicitacoes/${Number(id)}/impressao/`)
        .then(async response => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.error || 'Erro ao carregar.');
            return data;
        })
        .then(data => {
            const sol = data.solicitacao || {};
            const itens = [
                ...(data.itens_pendentes || []).map(item => ({ ...item, situacao: item.situacao || 'PENDENTE' })),
                ...(data.itens_processados || [])
            ];

            const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
            const isKg = sol.unidade_controle === 'QUILOGRAMA';

            /*
             * Unidade exibida no relatório:
             *
             * - somente BAG  -> BAG
             * - somente SC   -> SC
             * - BAG + SC     -> BAG/SC
             *
             * A informação vem dos próprios itens selecionados,
             * preservando a embalagem registrada no empenho.
             */
            const normalizarEmbalagem = valor => {
                const texto = String(
                    valor ?? ''
                )
                    .trim()
                    .toUpperCase();

                if (
                    texto === 'BAG'
                    || texto === 'BAGS'
                    || texto === 'BIG BAG'
                    || texto === 'BIGBAG'
                ) {
                    return 'BAG';
                }

                if (
                    texto === 'SC'
                    || texto === 'SACO'
                    || texto === 'SACOS'
                ) {
                    return 'SC';
                }

                return texto;
            };

            const embalagensEncontradas = [
                ...new Set(
                    itens
                        .map(item => (
                            normalizarEmbalagem(
                                item.embalagem
                            )
                        ))
                        .filter(Boolean)
                )
            ];

            /*
             * Garante sempre BAG antes de SC:
             * BAG/SC
             * e não SC/BAG dependendo da ordem dos itens.
             */
            embalagensEncontradas.sort(
                (a, b) => {
                    const ordem = {
                        'BAG': 1,
                        'SC': 2
                    };

                    return (
                        (ordem[a] ?? 99)
                        - (ordem[b] ?? 99)
                    );
                }
            );

            const unidadeEmbalagem = (
                embalagensEncontradas.length
                    ? embalagensEncontradas.join('/')
                    : 'BAGS/SC'
            );

            const unidade = (
                isKg
                    ? 'KG'
                    : unidadeEmbalagem
            );

            const num = v => Number(v || 0).toLocaleString(
                'pt-BR',
                {
                    minimumFractionDigits: (
                        isKg
                            ? 2
                            : 0
                    ),
                    maximumFractionDigits: 2
                }
            );
            const qtdEmp = sol.quantidade_empenhada_display ?? sol.quantidade_empenhada ?? 0;
            const totalItens = itens.reduce((s, i) => s + Number(i.quantidade || 0), 0);
            const destino = sol.destino || '';
            const motorista = sol.motorista || '';
            const placa = sol.placa || '';
            const observacao = sol.observacao || '';
            const isCarga = String(sol.tipo_solicitacao || '').toUpperCase() === 'CARGA';
            const criteriosSecundarios = [
                sol.criterios?.armazem ? `Armazém: ${sol.criterios.armazem}` : '',
                !isCarga && sol.criterios?.produto ? `Produto: ${sol.criterios.produto}` : '',
                !isCarga && sol.criterios?.especie ? `Espécie: ${sol.criterios.especie}` : '',
                !isCarga && sol.criterios?.cliente ? `Cliente: ${sol.criterios.cliente}` : ''
            ].filter(Boolean);

            const statusClasse = sol.status === 'CONCLUIDO' ? 'status-concluido' : sol.status === 'CANCELADO' ? 'status-cancelado' : 'status-andamento';
            const totalPesoCarga = itens.reduce((soma, item) => soma + Number(item.peso_total || 0), 0);
            const pesoBr = valor => Number(valor || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
            const tituloRelatorio = isCarga ? 'RELATÓRIO DE CARGA / EXPEDIÇÃO' : 'RELATÓRIO DE SOLICITAÇÃO';

            // TSI mantém a coluna Situação.
            // Carga não precisa de Situação e começa diretamente por Cliente.
            const cabecalhoSituacao = isCarga
                ? ''
                : '<th class="col-status-print">Situação</th>';

            const tabelaItensHtml = itens.length ? `<table class="tabela-solicitacao">
              <thead><tr>${cabecalhoSituacao}<th class="col-cliente-print">Cliente</th><th class="col-codigo-print">Código</th><th class="col-lote-print">Lote</th><th class="col-descricao-impressao">Descrição</th><th class="col-categoria-print">Categoria</th><th class="col-peneira-print">Peneira</th><th class="col-az-print">AZ</th><th class="col-endereco-print">Endereço</th><th class="col-qtd">Qtd</th><th class="col-peso">Peso</th></tr></thead>
              <tbody>${itens.map(item => {
                const situacao = String(item.situacao || 'PENDENTE').toUpperCase();
                const classe = situacao.includes('TRANSF') ? 'badge-transferido' : situacao.includes('EXPED') ? 'badge-expedido' : 'badge-pendente';
                const celulaSituacao = isCarga
                    ? ''
                    : `<td class="col-status-print"><span class="badge-situacao ${classe}">${esc(situacao)}</span></td>`;
                return `<tr>${celulaSituacao}<td class="col-cliente-print">${esc(item.cliente || sol.criterios?.cliente || 'CS')}</td><td class="col-codigo-print"><strong>${esc(item.codigo || item.produto || '-')}</strong></td><td class="col-lote-print">${esc(item.lote || '-')}</td><td class="col-descricao-impressao">${esc(item.descricao || '-')}</td><td class="col-categoria-print">${esc(item.categoria || '-')}</td><td class="col-peneira-print">${esc(item.peneira || '-')}</td><td class="col-az-print">${esc(item.az || item.armazem || '-')}</td><td class="col-endereco-print">${esc(item.endereco || '-')}</td><td class="col-qtd">${num(item.quantidade)}</td><td class="col-peso">${pesoBr(item.peso_total)} kg</td></tr>`;
              }).join('')}</tbody>
              <tfoot><tr class="total"><td colspan="${isCarga ? 8 : 9}" style="text-align:right">TOTAL</td><td class="col-qtd">${num(totalItens)}</td><td class="col-peso">${pesoBr(totalPesoCarga)} kg</td></tr></tfoot>
            </table>` : '<div style="padding:28px;color:#718078;text-align:center;">Nenhum item registrado.</div>';

            win.document.open();
            win.document.write(`<!doctype html>

.troca-relatorio input, .troca-relatorio select { min-height: 36px; border: 1px solid #cfdcd3; border-radius: 8px; padding: 6px 9px; background:#fff; color:#24382b; font:inherit; font-size:12px; }
@media(max-width:760px){ .troca-relatorio{grid-template-columns:1fr}.troca-relatorio label{white-space:normal} }

@media print {
  .troca-relatorio { display:none !important; }
  @page { size: A4 landscape; margin: 5mm; }
  html, body { width: 297mm; background: #fff; }
  body { padding: 0; }
  .folha { width: 287mm; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
  .acoes { display: none !important; }
  .topo, .resumo, .info-grid, .linha-destino-obs, .criterios, .rodape { break-inside: avoid !important; }
  thead { display: table-header-group; }
  tr, td, th { break-inside: avoid !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body>
<div class="troca-relatorio">
  <label for="trocarRelatorioSelect"><i class="fas fa-list"></i> Trocar relatório</label>
  <input type="search" id="trocarRelatorioBusca" placeholder="Pesquisar carga/solicitação..." autocomplete="off">
  <select id="trocarRelatorioSelect"><option value="">Carregando histórico...</option></select>
</div>
<main class="folha">
 <header class="topo">
    <div class="topo-principal">
      <h1>${esc(tituloRelatorio)}</h1>
      <p>#${esc(sol.id)}</p>
    </div>
    <div class="numero-card">
      <small>ID</small>
      <strong>${esc(sol.titulo || 'Solicitação')}</strong>
    </div>
  </header>

  <section class="resumo">
    <div class="indicador indicador-status"><b>Status</b><strong class="${statusClasse}">${esc(sol.status_display || sol.status || '-')}</strong></div>
    <div class="indicador indicador-solicitado"><b>Quantidade solicitada</b><strong>${num(sol.quantidade_solicitada)} ${unidade}</strong></div>
    <div class="indicador indicador-empenhado"><b>Quantidade empenhada</b><strong>${num(qtdEmp)} ${unidade}</strong></div>
    <div class="indicador indicador-movimentado"><b>Quantidade movimentada</b><strong>${num(sol.quantidade_movimentada)} ${unidade}</strong></div>
  </section>

  <section class="info-grid">
    ${isCarga ? `<div class="info"><b>Motorista</b><span>${esc(motorista || 'Não informado')}</span></div>` : ''}
    ${isCarga ? `<div class="info"><b>Placa</b><span>${esc(placa || 'Não informada')}</span></div>` : ''}
    <div class="info"><b>Criado por</b><span>${esc(sol.criador || '-')}</span></div>
    <div class="info"><b>Criação</b><span>${esc(sol.data_criacao || '-')}</span></div>
    <div class="info"><b>Atualização</b><span>${esc(sol.data_atualizacao || '-')}</span></div>
    <div class="info"><b>Finalização</b><span>${esc(sol.data_finalizacao || '-')}</span></div>
  </section>

  <!-- LINHA UNICA: DESTINO E OBSERVACAO LADO A LADO -->
  <section class="linha-destino-obs">
    <div class="box-destino">
      <b>Destino</b>
      <span>${esc(destino || 'Não informado')}</span>
    </div>
    <div class="box-obs">
      <b>Observação</b>
      <span>${esc(observacao || 'Nenhuma observação.')}</span>
    </div>
  </section>

  ${criteriosSecundarios.length ? `<section class="criterios"><b>Critérios:</b> ${esc(criteriosSecundarios.join(' · '))}</section>` : ''}

  <div class="titulo-itens">
    <span>${isCarga ? 'Itens da carga' : 'Itens da solicitação'}</span>
    <span>${itens.length} registro(s) · Total ${num(totalItens)} ${unidade}${isCarga ? ` · ${pesoBr(totalPesoCarga)} kg` : ''}</span>
  </div>

  <div class="tabela-container">
    ${tabelaItensHtml}
  </div>

  ${isCarga ? `
  <section class="assinaturas-carga">
    <div class="assinatura-carga-item">
      <div class="assinatura-carga-linha"></div>
      <span>Assinatura do Conferente</span>
    </div>
    <div class="assinatura-carga-item">
      <div class="assinatura-carga-linha"></div>
      <span>Assinatura do Motorista</span>
    </div>
  </section>` : ''}

  <footer class="rodape">
    <span>INFINITY STOCK · Sistema de Controle de Estoque</span>
    <span>Documento gerado em ${esc(data.emitido_em || '-')}</span>
  </footer>

  <div class="acoes">
    <button type="button" class="botao-imprimir" onclick="window.print()">Imprimir</button>
    <button
      type="button"
      class="botao-fechar"
      onclick="
        if(window.frameElement && window.parent){
          window.parent.fecharImpressaoMobile();
        }else{
          window.close();
        }
      "
    >Fechar</button>
  </div>
</main>
<script>
(function(){
  var atual = Number("${Number(id)}");
  var seletor = document.getElementById('trocarRelatorioSelect');
  var busca = document.getElementById('trocarRelatorioBusca');
  var lista = [];

  function renderLista(termo){
    termo = String(termo || '').toLocaleLowerCase('pt-BR').trim();
    seletor.innerHTML = '';
    lista.filter(function(item){
      var texto = [item.id, item.titulo, item.tipo_solicitacao_display, item.status_display || item.status, item.destino].join(' ').toLocaleLowerCase('pt-BR');
      return !termo || texto.indexOf(termo) >= 0;
    }).forEach(function(item){
      var opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = (item.tipo_solicitacao === 'CARGA' ? 'CARGA · ' : 'TSI · ') + (item.titulo || ('#' + item.id)) + ' · ' + (item.status_display || item.status || '');
      if (Number(item.id) === atual) opt.selected = true;
      seletor.appendChild(opt);
    });
    if (!seletor.options.length) {
      var vazio = document.createElement('option');
      vazio.value = '';
      vazio.textContent = 'Nenhum relatório encontrado';
      seletor.appendChild(vazio);
    }
  }

  fetch('/api/solicitacoes/listar/')
    .then(function(r){ return r.json(); })
    .then(function(data){ lista = Array.isArray(data.solicitacoes) ? data.solicitacoes : []; renderLista(''); })
    .catch(function(){ seletor.innerHTML = '<option value="">Não foi possível carregar a lista</option>'; });

  busca.addEventListener('input', function(){ renderLista(this.value); });
  seletor.addEventListener('change', function(){
    var novo = Number(this.value || 0);
    if (!novo || novo === atual) return;
    if (window.frameElement && window.parent && typeof window.parent.gerarImpressaoSolicitacao === 'function') {
      window.parent.gerarImpressaoSolicitacao(novo, window);
    } else if (window.opener && typeof window.opener.gerarImpressaoSolicitacao === 'function') {
      window.opener.gerarImpressaoSolicitacao(novo, window);
    }
  });
})();
<\/script>
</body></html>`);
            win.document.close();
        })
        .catch(erro => {
            win.document.body.innerHTML = `<div style="max-width:650px;margin:60px auto;padding:25px;border:1px solid #efc4c8;border-radius:14px;background:#fff4f5;color:#a32e39;font-family:Arial;text-align:center;"><h3>Não foi possível gerar o relatório</h3><p>${String(erro.message || erro)}</p></div>`;
        });
}
function imprimirCardKanban(id) {
    gerarImpressaoSolicitacao(id);
}
</script>
